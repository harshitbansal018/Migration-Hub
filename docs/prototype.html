ED\" \u003eRefunded\u003c/option\u003e\u003coption value=\"VOIDED\" selected\u003eVoided\u003c/option\u003e\n                      \u003c/select\u003e\u003c/td\u003e\n                      \u003ctd\u003e\u003cselect class=\"select select--sm\" name=\"map.failed.fulfilment\" aria-label=\"failed fulfilment\"\u003e\n                        \u003coption value=\"FULFILLED\" \u003eFulfilled\u003c/option\u003e\u003coption value=\"UNFULFILLED\" selected\u003eUnfulfilled\u003c/option\u003e\n                      \u003c/select\u003e\u003c/td\u003e\n                    \u003c/tr\u003e\n                  \n                \u003c/tbody\u003e\n              \u003c/table\u003e\n            \u003c/div\u003e\n          \u003c/div\u003e\n        \n\n      \n\n      \u003cdiv class=\"wizard-footer\"\u003e\n        \u003cbutton class=\"btn btn--plain btn--critical-plain\" type=\"button\" style=\"color:var(--critical)\"\n          data-post=\"/migrations/13/discard\" data-then=\"/migrations\"\n          data-confirm=\"Discard this draft?\\n\\nNothing has been migrated yet, so nothing is lost.\" data-confirm-label=\"Discard\" data-destructive\u003e\n          Discard\n        \u003c/button\u003e\n        \u003cdiv class=\"wizard-footer__actions\"\u003e\n          \n            \u003cbutton class=\"btn\" type=\"button\" data-navigate=\"/migrations/13?step=3\"\u003eBack\u003c/button\u003e\n          \n          \n            \u003cbutton class=\"btn btn--primary\" type=\"submit\" id=\"continue\" \u003eContinue\u003c/button\u003e\n          \n        \u003c/div\u003e\n      \u003c/div\u003e\n    \u003c/form\u003e\n\n    \u003cp class=\"footnote\"\u003e\n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003crect x=\"4.5\" y=\"10.5\" width=\"15\" height=\"10\" rx=\"2\"/\u003e\u003cpath d=\"M8 10.5V7.5a4 4 0 0 1 8 0v3\"/\u003e\u003c/svg\u003e\n Keys are encrypted at rest. Your data is never stored in our database — only counts and ID pairs.\u003c/p\u003e\n  \u003c/main\u003e","scripts":["\n    (function () {\n      var form = document.getElementById(\"wizard\");\n      var step = Number(form.dataset.step);\n      var id = form.dataset.id;\n      var base = \"/migrations/\" + id;\n\n      function values() {\n        var data = { step: step };\n        if (step === 1) {\n          var chosen = form.querySelector(\"input[name=platform]:checked\");\n          data.platform = chosen ? chosen.value : \"\";\n        }\n        if (step === 3) {\n          data.entities = Array.prototype.map.call(form.querySelectorAll(\"input[name=entities]:checked\"), function (box) { return box.value; });\n          var range = form.querySelector(\"input[name=orders_range]:checked\");\n          data.orders_range = range ? range.value : \"all\";\n          data.orders_from = (form.querySelector(\"[name=orders_from]\") || {}).value || \"\";\n          data.orders_to = (form.querySelector(\"[name=orders_to]\") || {}).value || \"\";\n        }\n        if (step === 4) {\n          data.order_status_map = {};\n          Array.prototype.forEach.call(form.elements, function (field) {\n            if (!field.name) return;\n            if (field.name.indexOf(\"map.\") === 0) {\n              var parts = field.name.split(\".\");\n              data.order_status_map[parts[1]] = data.order_status_map[parts[1]] || {};\n              data.order_status_map[parts[1]][parts[2]] = field.value;\n            } else if (field.type === \"checkbox\") {\n              data[field.name] = field.checked;\n            } else if (field.type === \"radio\") {\n              if (field.checked) data[field.name] = field.value;\n            }\n          });\n          // Unrendered sections keep their defaults on the server.\n          [\"publish_online_store\", \"send_invites\", \"keep_order_numbers\", \"silent_orders\"].forEach(function (name) {\n            if (!(name in data)) data[name] = {\"product_status\":\"same\",\"sku_exists\":\"skip\",\"publish_online_store\":true,\"extra_attributes\":\"skip\",\"email_exists\":\"skip\",\"send_invites\":false,\"keep_order_numbers\":false,\"silent_orders\":true,\"orders_range\":\"range\",\"orders_from\":\"2024-01-01\",\"orders_to\":null,\"page_status\":\"same\",\"order_status_map\":{\"completed\":{\"payment\":\"PAID\",\"fulfilment\":\"FULFILLED\"},\"processing\":{\"payment\":\"PAID\",\"fulfilment\":\"UNFULFILLED\"},\"on-hold\":{\"payment\":\"PENDING\",\"fulfilment\":\"UNFULFILLED\"},\"pending\":{\"payment\":\"PENDING\",\"fulfilment\":\"UNFULFILLED\"},\"refunded\":{\"payment\":\"REFUNDED\",\"fulfilment\":\"UNFULFILLED\"},\"cancelled\":{\"payment\":\"VOIDED\",\"fulfilment\":\"UNFULFILLED\"},\"failed\":{\"payment\":\"VOIDED\",\"fulfilment\":\"UNFULFILLED\"}},\"platform\":\"woocommerce\"}[name];\n          });\n        }\n        return data;\n      }\n\n      form.addEventListener(\"submit\", async function (event) {\n        event.preventDefault();\n        window.appClearError();\n        var button = document.getElementById(\"continue\");\n        if (!button || button.disabled) return;\n        try {\n          var result = await window.appPostJson(base + \"/wizard\", values(), button);\n          window.appNavigate(base + \"?step=\" + result.next);\n        } catch (error) {\n          window.appPageError(error.message);\n        }\n      });\n\n      /* ---- step 1: choosing a tile enables Continue ---- */\n      if (step === 1) {\n        var cont = document.getElementById(\"continue\");\n        var update = function () { cont.disabled = !form.querySelector(\"input[name=platform]:checked\"); };\n        form.addEventListener(\"change\", update);\n        update();\n      }\n\n      /* ---- step 2: test connection ---- */\n      var test = document.getElementById(\"test-connection\");\n      if (test) {\n        var scan = document.getElementById(\"scan\");\n        var escape = function (text) { var div = document.createElement(\"div\"); div.textContent = text; return div.innerHTML; };\n\n        test.addEventListener(\"click\", async function () {\n          window.appClearError();\n          var body = {};\n          [\"base_url\", \"consumer_key\", \"consumer_secret\", \"username\", \"app_password\"].forEach(function (name) {\n            var field = form.querySelector(\"[name=\" + name + \"]\");\n            if (field) body[name] = field.value.trim();\n          });\n          if (!body.base_url) {\n            window.appPageError(\"Enter your store's address first.\");\n            form.querySelector(\"[name=base_url]\").focus();\n            return;\n          }\n          scan.innerHTML = '\u003cdiv class=\"scan__placeholder\"\u003e\u003cdiv\u003e\u003cspan class=\"btn is-loading\" style=\"box-shadow:none;background:none;width:24px\"\u003e\u003c/span\u003e\u003cp\u003eConnecting and counting your data…\u003cbr\u003e\u003cspan style=\"font-size:12.5px\"\u003eThis can take a few seconds on slower hosting.\u003c/span\u003e\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e';\n          try {\n            var result = await window.appPostJson(base + \"/connect\", body, test);\n            scan.innerHTML =\n              '\u003cdiv class=\"muted\" style=\"font-size:12.5px\"\u003eConnection result\u003c/div\u003e' +\n              '\u003cdiv class=\"scan__status scan__status--ok\"\u003e✓ Connected — ' + escape(result.version || \"\") + '\u003c/div\u003e' +\n              '\u003cdiv class=\"muted\" style=\"margin-top:6px;font-size:12.5px\"\u003eWe found in your store:\u003c/div\u003e' +\n              '\u003cul class=\"scan__list\"\u003e' + result.counts.map(function (row) {\n                return \"\u003cli\u003e\u003cspan\u003e\" + escape(row.label) + \"\u003c/span\u003e\u003cstrong\u003e\" + row.count.toLocaleString(\"en-US\") + \"\u003c/strong\u003e\u003c/li\u003e\";\n              }).join(\"\") + \"\u003c/ul\u003e\";\n            [\"consumer_key\", \"consumer_secret\", \"app_password\"].forEach(function (name) {\n              var field = form.querySelector(\"[name=\" + name + \"]\");\n              if (field) { field.value = \"\"; field.placeholder = name === \"consumer_key\" ? result.hint + \"  (saved)\" : \"(saved)\"; }\n            });\n            form.querySelector(\"[name=base_url]\").value = result.base_url;\n            document.getElementById(\"continue\").disabled = false;\n            window.appToast(\"Connected\");\n          } catch (error) {\n            scan.innerHTML = '\u003cdiv class=\"muted\" style=\"font-size:12.5px\"\u003eConnection result\u003c/div\u003e\u003cdiv class=\"scan__status scan__status--error\"\u003e✕ Could not connect\u003c/div\u003e\u003cp style=\"margin-top:8px\"\u003e' + escape(error.message) + \"\u003c/p\u003e\";\n            document.getElementById(\"continue\").disabled = true;\n          }\n        });\n      }\n\n      /* ---- step 3: orders pull in products + customers; the date range follows orders ---- */\n      if (step === 3) {\n        var boxes = function (key) { return form.querySelector(\"input[name=entities][value=\" + key + \"]\"); };\n        var range = document.getElementById(\"orders-range\");\n        form.addEventListener(\"change\", function (event) {\n          var orders = boxes(\"orders\");\n          if (event.target === orders \u0026\u0026 orders.checked) {\n            [\"products\", \"customers\"].forEach(function (key) { var box = boxes(key); if (box \u0026\u0026 !box.disabled) box.checked = true; });\n          }\n          if (orders \u0026\u0026 orders.checked \u0026\u0026 [\"products\", \"customers\"].some(function (key) { var box = boxes(key); return box \u0026\u0026 event.target === box \u0026\u0026 !box.checked; })) {\n            orders.checked = false;\n            window.appToast(\"Orders need their products and customers, so Orders was unticked too.\");\n          }\n          if (range) range.hidden = !(orders \u0026\u0026 orders.checked);\n          if (event.target.name === \"orders_from\" || event.target.name === \"orders_to\") {\n            var r = form.querySelector(\"input[name=orders_range][value=range]\");\n            if (r) r.checked = true;\n          }\n        });\n      }\n    })();\n  "]},"wizard-5":{"title":"New migration","html":"\u003cmain class=\"page page--narrow\"\u003e\n    \u003cbutton class=\"back-link\" type=\"button\" data-navigate=\"/migrations\"\u003e\n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"M19 12H5\"/\u003e\u003cpath d=\"m11 18-6-6 6-6\"/\u003e\u003c/svg\u003e\n Migrations\u003c/button\u003e\n    \u003cheader class=\"page-header\"\u003e\n      \u003cdiv\u003e\n        \u003ch1 class=\"page-header__title\"\u003eNew migration \u003cspan class=\"badge\"\u003eDraft #13\u003c/span\u003e\u003c/h1\u003e\n        \u003cp class=\"page-header__sub\"\u003eYour choices are saved as you go — leave any time and continue later.\u003c/p\u003e\n      \u003c/div\u003e\n    \u003c/header\u003e\n\n    \u003col class=\"stepper\" aria-label=\"Steps\"\u003e\n      \n        \u003cli class=\"stepper__item stepper__item--done\"\n          data-navigate=\"/migrations/13?step=1\" role=\"link\" tabindex=\"0\"\n          \u003e\n          \u003cspan class=\"stepper__num\"\u003e\n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"13\" height=\"13\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"m5 12.5 4.5 4.5L19 7.5\"/\u003e\u003c/svg\u003e\n\u003c/span\u003e\n          \u003cspan\u003ePlatform\u003c/span\u003e\n        \u003c/li\u003e\n      \n        \u003cli class=\"stepper__item stepper__item--done\"\n          data-navigate=\"/migrations/13?step=2\" role=\"link\" ta note\"\u003e\n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003crect x=\"4.5\" y=\"10.5\" width=\"15\" height=\"10\" rx=\"2\"/\u003e\u003cpath d=\"M8 10.5V7.5a4 4 0 0 1 8 0v3\"/\u003e\u003c/svg\u003e\n Keys are encrypted at rest. Your data is never stored in our database — only counts and ID pairs.\u003c/p\u003e\n  \u003c/main\u003e","scripts":["\n    (function () {\n      var form = document.getElementById(\"wizard\");\n      var step = Number(form.dataset.step);\n      var id = form.dataset.id;\n      var base = \"/migrations/\" + id;\n\n      function values() {\n        var data = { step: step };\n        if (step === 1) {\n          var chosen = form.querySelector(\"input[name=platform]:checked\");\n          data.platform = chosen ? chosen.value : \"\";\n        }\n        if (step === 3) {\n          data.entities = Array.prototype.map.call(form.querySelectorAll(\"input[name=entities]:checked\"), function (box) { return box.value; });\n          var range = form.querySelector(\"input[name=orders_range]:checked\");\n          data.orders_range = range ? range.value : \"all\";\n          data.orders_from = (form.querySelector(\"[name=orders_from]\") || {}).value || \"\";\n          data.orders_to = (form.querySelector(\"[name=orders_to]\") || {}).value || \"\";\n        }\n        if (step === 4) {\n          data.order_status_map = {};\n          Array.prototype.forEach.call(form.elements, function (field) {\n            if (!field.name) return;\n            if (field.name.indexOf(\"map.\") === 0) {\n              var parts = field.name.split(\".\");\n              data.order_status_map[parts[1]] = data.order_status_map[parts[1]] || {};\n              data.order_status_map[parts[1]][parts[2]] = field.value;\n            } else if (field.type === \"checkbox\") {\n              data[field.name] = field.checked;\n            } else if (field.type === \"radio\") {\n              if (field.checked) data[field.name] = field.value;\n            }\n          });\n          // Unrendered sections keep their defaults on the server.\n          [\"publish_online_store\", \"send_invites\", \"keep_order_numbers\", \"silent_orders\"].forEach(function (name) {\n            if (!(name in data)) data[name] = {\"product_status\":\"same\",\"sku_exists\":\"skip\",\"publish_online_store\":true,\"extra_attributes\":\"skip\",\"email_exists\":\"skip\",\"send_invites\":false,\"keep_order_numbers\":false,\"silent_orders\":true,\"orders_range\":\"range\",\"orders_from\":\"2024-01-01\",\"orders_to\":null,\"page_status\":\"same\",\"order_status_map\":{\"completed\":{\"payment\":\"PAID\",\"fulfilment\":\"FULFILLED\"},\"processing\":{\"payment\":\"PAID\",\"fulfilment\":\"UNFULFILLED\"},\"on-hold\":{\"payment\":\"PENDING\",\"fulfilment\":\"UNFULFILLED\"},\"pending\":{\"payment\":\"PENDING\",\"fulfilment\":\"UNFULFILLED\"},\"refunded\":{\"payment\":\"REFUNDED\",\"fulfilment\":\"UNFULFILLED\"},\"cancelled\":{\"payment\":\"VOIDED\",\"fulfilment\":\"UNFULFILLED\"},\"failed\":{\"payment\":\"VOIDED\",\"fulfilment\":\"UNFULFILLED\"}},\"platform\":\"woocommerce\"}[name];\n          });\n        }\n        return data;\n      }\n\n      form.addEventListener(\"submit\", async function (event) {\n        event.preventDefault();\n        window.appClearError();\n        var button = document.getElementById(\"continue\");\n        if (!button || button.disabled) return;\n        try {\n          var result = await window.appPostJson(base + \"/wizard\", values(), button);\n          window.appNavigate(base + \"?step=\" + result.next);\n        } catch (error) {\n          window.appPageError(error.message);\n        }\n      });\n\n      /* ---- step 1: choosing a tile enables Continue ---- */\n      if (step === 1) {\n        var cont = document.getElementById(\"continue\");\n        var update = function () { cont.disabled = !form.querySelector(\"input[name=platform]:checked\"); };\n        form.addEventListener(\"change\", update);\n        update();\n      }\n\n      /* ---- step 2: test connection ---- */\n      var test = document.getElementById(\"test-connection\");\n      if (test) {\n        var scan = document.getElementById(\"scan\");\n        var escape = function (text) { var div = document.createElement(\"div\"); div.textContent = text; return div.innerHTML; };\n\n        test.addEventListener(\"click\", async function () {\n          window.appClearError();\n          var body = {};\n          [\"base_url\", \"consumer_key\", \"consumer_secret\", \"username\", \"app_password\"].forEach(function (name) {\n            var field = form.querySelector(\"[name=\" + name + \"]\");\n            if (field) body[name] = field.value.trim();\n          });\n          if (!body.base_url) {\n            window.appPageError(\"Enter your store's address first.\");\n            form.querySelector(\"[name=base_url]\").focus();\n            return;\n          }\n          scan.innerHTML = '\u003cdiv class=\"scan__placeholder\"\u003e\u003cdiv\u003e\u003cspan class=\"btn is-loading\" style=\"box-shadow:none;background:none;width:24px\"\u003e\u003c/span\u003e\u003cp\u003eConnecting and counting your data…\u003cbr\u003e\u003cspan style=\"font-size:12.5px\"\u003eThis can take a few seconds on slower hosting.\u003c/span\u003e\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e';\n          try {\n            var result = await window.appPostJson(base + \"/connect\", body, test);\n            scan.innerHTML =\n              '\u003cdiv class=\"muted\" style=\"font-size:12.5px\"\u003eConnection result\u003c/div\u003e' +\n              '\u003cdiv class=\"scan__status scan__status--ok\"\u003e✓ Connected — ' + escape(result.version || \"\") + '\u003c/div\u003e' +\n              '\u003cdiv class=\"muted\" style=\"margin-top:6px;font-size:12.5px\"\u003eWe found in your store:\u003c/div\u003e' +\n              '\u003cul class=\"scan__list\"\u003e' + result.counts.map(function (row) {\n                return \"\u003cli\u003e\u003cspan\u003e\" + escape(row.label) + \"\u003c/span\u003e\u003cstrong\u003e\" + row.count.toLocaleString(\"en-US\") + \"\u003c/strong\u003e\u003c/li\u003e\";\n              }).join(\"\") + \"\u003c/ul\u003e\";\n            [\"consumer_key\", \"consumer_secret\", \"app_password\"].forEach(function (name) {\n              var field = form.querySelector(\"[name=\" + name + \"]\");\n              if (field) { field.value = \"\"; field.placeholder = name === \"consumer_key\" ? result.hint + \"  (saved)\" : \"(saved)\"; }\n            });\n            form.querySelector(\"[name=base_url]\").value = result.base_url;\n            document.getElementById(\"continue\").disabled = false;\n            window.appToast(\"Connected\");\n          } catch (error) {\n            scan.innerHTML = '\u003cdiv class=\"muted\" style=\"font-size:12.5px\"\u003eConnection result\u003c/div\u003e\u003cdiv class=\"scan__status scan__status--error\"\u003e✕ Could not connect\u003c/div\u003e\u003cp style=\"margin-top:8px\"\u003e' + escape(error.message) + \"\u003c/p\u003e\";\n            document.getElementById(\"continue\").disabled = true;\n          }\n        });\n      }\n\n      /* ---- step 3: orders pull in products + customers; the date range follows orders ---- */\n      if (step === 3) {\n        var boxes = function (key) { return form.querySelector(\"input[name=entities][value=\" + key + \"]\"); };\n        var range = document.getElementById(\"orders-range\");\n        form.addEventListener(\"change\", function (event) {\n          var orders = boxes(\"orders\");\n          if (event.target === orders \u0026\u0026 orders.checked) {\n            [\"products\", \"customers\"].forEach(function (key) { var box = boxes(key); if (box \u0026\u0026 !box.disabled) box.checked = true; });\n          }\n          if (orders \u0026\u0026 orders.checked \u0026\u0026 [\"products\", \"customers\"].some(function (key) { var box = boxes(key); return box \u0026\u0026 event.target === box \u0026\u0026 !box.checked; })) {\n            orders.checked = false;\n            window.appToast(\"Orders need their products and customers, so Orders was unticked too.\");\n          }\n          if (range) range.hidden = !(orders \u0026\u0026 orders.checked);\n          if (event.target.name === \"orders_from\" || event.target.name === \"orders_to\") {\n            var r = form.querySelector(\"input[name=orders_range][value=range]\");\n            if (r) r.checked = true;\n          }\n        });\n      }\n    })();\n  "]},"progress-12":{"title":"Migration #12","html":"\u003cmain class=\"page\"\u003e\n    \u003cbutton class=\"back-link\" type=\"button\" data-navigate=\"/migrations\"\u003e\n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"M19 12H5\"/\u003e\u003cpath d=\"m11 18-6-6 6-6\"/\u003e\u003c/svg\u003e\n Migrations\u003c/button\u003e\n    \u003cheader class=\"page-header\"\u003e\n      \u003cdiv\u003e\n        \u003ch1 class=\"page-header__title\"\u003e\n          Migration #12\n          \u003cspan id=\"status-badge\"\u003e\n\n\u003cspan class=\"badge badge--info badge--pulse\" data-status-badge\u003e\n  \u003cspan class=\"badge__dot\"\u003e\u003c/span\u003e\n  Running\n\u003c/span\u003e\n\u003c/span\u003e\n          \n        \u003c/h1\u003e\n        \u003cp class=\"page-header__sub\"\u003e\n          WooCommerce · myshop.com\n          \n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"13\" height=\"13\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"M5 12h14\"/\u003e\u003cpath d=\"m13 6 6 6-6 6\"/\u003e\u003c/svg\u003e\n myshop.myshopify. rySelector(\".progress__fill\");\n            fill.style.width = step.percent + \"%\";\n            fill.classList.toggle(\"progress__fill--success\", step.status === \"done\");\n            track.classList.toggle(\"progress--running\", step.status === \"running\");\n            row.querySelector(\"[data-phase]\").textContent = step.phaseNote || \"\";\n            row.querySelector(\"[data-done]\").textContent = fmt(step.succeeded);\n            var failed = row.querySelector(\"[data-failed]\");\n            failed.textContent = fmt(step.failed);\n            failed.style.cssText = step.failed ? \"color:var(--critical);font-weight:600\" : \"\";\n            row.querySelector(\"[data-skipped]\").textContent = fmt(step.skipped);\n            row.querySelector(\"[data-status]\").innerHTML = badge(STEP[step.status] || [step.status, \"\"], step.status === \"running\");\n          });\n        } catch (error) {\n          failures += 1;\n        }\n        // Back off gently if the app is unreachable; normal pace is 3 s.\n        setTimeout(poll, Math.min(3000 * Math.pow(2, failures), 30000));\n      }\n\n      setTimeout(poll, 3000);\n    })();\n  "]},"progress-14":{"title":"Migration #14","html":"\u003cmain class=\"page\"\u003e\n    \u003cbutton class=\"back-link\" type=\"button\" data-navigate=\"/migrations\"\u003e\n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"M19 12H5\"/\u003e\u003cpath d=\"m11 18-6-6 6-6\"/\u003e\u003c/svg\u003e\n Migrations\u003c/button\u003e\n    \u003cheader class=\"page-header\"\u003e\n      \u003cdiv\u003e\n        \u003ch1 class=\"page-header__title\"\u003e\n          Migration #14\n          \u003cspan id=\"status-badge\"\u003e\n\n\u003cspan class=\"badge badge--info badge--pulse\" data-status-badge\u003e\n  \u003cspan class=\"badge__dot\"\u003e\u003c/span\u003e\n ued-banner\").hidden = data.status !== \"queued\";\n          document.querySelector(\"[data-control=pause]\").hidden = data.status === \"paused\";\n          document.querySelector(\"[data-control=resume]\").hidden = data.status !== \"paused\";\n\n          data.steps.forEach(function (step) {\n            var row = document.querySelector('tr[data-entity=\"' + step.entity + '\"]');\n            if (!row) return;\n            var track = row.querySelector(\".progress\");\n            var fill = row.querySelector(\".progress__fill\");\n            fill.style.width = step.percent + \"%\";\n            fill.classList.toggle(\"progress__fill--success\", step.status === \"done\");\n            track.classList.toggle(\"progress--running\", step.status === \"running\");\n            row.querySelector(\"[data-phase]\").textContent = step.phaseNote || \"\";\n            row.querySelector(\"[data-done]\").textContent = fmt(step.succeeded);\n            var failed = row.querySelector(\"[data-failed]\");\n            failed.textContent = fmt(step.failed);\n            failed.style.cssText = step.failed ? \"color:var(--critical);font-weight:600\" : \"\";\n            row.querySelector(\"[data-skipped]\").textContent = fmt(step.skipped);\n            row.querySelector(\"[data-status]\").innerHTML = badge(STEP[step.status] || [step.status, \"\"], step.status === \"running\");\n          });\n        } catch (error) {\n          failures += 1;\n        }\n        // Back off gently if the app is unreachable; normal pace is 3 s.\n        setTimeout(poll, Math.min(3000 * Math.pow(2, failures), 30000));\n      }\n\n      setTimeout(poll, 3000);\n    })();\n  "]},"results-12":{"title":"Migration #12","html":"\u003cmain class=\"page\"\u003e\n    \u003cbutton class=\"back-link\" type=\"button\" data-navigate=\"/migrations\"\u003e\n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"
