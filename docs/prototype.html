<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Store Migration — clickable prototype</title>
<style>
/* app.css — Shopify Store Migration App.
 *
 * Rendered inside the Shopify admin iframe, so it follows the admin's own
 * look (Polaris): white cards on a grey canvas, dark primary buttons, quiet
 * borders. The brand teal is the accent — links, progress, focus — never
 * the furniture. Every colour is a token: change these and the app follows.
 */

:root {
  --brand: #0b5368;
  --brand-hover: #083f50;
  --brand-soft: #e6f1f4;
  --brand-line: #b9d6df;

  --canvas: #f1f2f4;
  --surface: #ffffff;
  --surface-subdued: #f7f7f7;
  --surface-hover: #f3f3f3;
  --line: #e3e3e3;
  --line-strong: #c9cccf;
  --text: #303030;
  --text-strong: #1a1a1a;
  --muted: #616161;
  --subtle: #8a8a8a;

  --primary: #303030;
  --primary-hover: #1a1a1a;

  --success: #0c7a43;
  --success-bg: #cdfee1;
  --success-soft: #eafbf1;
  --info: #00527c;
  --info-bg: #e0f0ff;
  --warning: #8a6116;
  --warning-bg: #ffef9d;
  --warning-soft: #fff8db;
  --critical: #b3261e;
  --critical-bg: #fee9e8;
  --critical-soft: #fff4f4;
  --neutral-bg: #ebebeb;

  --radius-sm: 8px;
  --radius: 12px;
  --shadow-card: 0 1px 0 rgba(26, 26, 26, 0.07), inset 0 0 0 1px rgba(0, 0, 0, 0.06);
  --shadow-raised: 0 4px 12px rgba(26, 26, 26, 0.08), inset 0 0 0 1px rgba(0, 0, 0, 0.06);
  --focus: 0 0 0 2px var(--surface), 0 0 0 4px var(--brand);

  --font: -apple-system, BlinkMacSystemFont, "San Francisco", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

*,
*::before,
*::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--canvas);
  color: var(--text);
  font: 14px/1.45 var(--font);
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, p { margin: 0; }
a { color: var(--brand); }
code { font-family: var(--mono); font-size: 0.88em; background: var(--surface-subdued); padding: 0.1em 0.35em; border-radius: 4px; border: 1px solid var(--line); }
strong { font-weight: 650; color: var(--text-strong); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.subtle { color: var(--subtle); }
.nowrap { white-space: nowrap; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }

/* ---------------- page loading bar (outside the admin only) ---------------- */

.is-navigating::before {
  content: "";
  position: fixed;
  inset: 0 auto auto 0;
  z-index: 1000;
  width: 40%;
  height: 3px;
  background: var(--brand);
  border-radius: 0 2px 2px 0;
  animation: page-loading 1.1s ease-in-out infinite;
}

@keyframes page-loading {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(250vw); }
}

/* ---------------- layout ---------------- */

.page {
  max-width: 1080px;
  margin: 0 auto;
  padding: 24px 16px 64px;
}

.page--narrow { max-width: 820px; }

.page-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.page-header__title {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  font-size: 20px;
  line-height: 1.3;
  font-weight: 700;
  color: var(--text-strong);
  letter-spacing: -0.01em;
}

.page-header__sub {
  margin-top: 4px;
  color: var(--muted);
}

.page-header__actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}

.back-link {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-bottom: 8px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 550;
  text-decoration: none;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
}

.back-link:hover { color: var(--text-strong); }

.stack { display: grid; gap: 16px; }
.stack--tight { display: grid; gap: 8px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row--between { justify-content: space-between; }
.row--end { justify-content: flex-end; }

.grid { display: grid; gap: 12px; }
.grid--4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grid--5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.grid--2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid--3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }

@media (max-width: 900px) {
  .grid--5 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .grid--4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 600px) {
  .grid--5, .grid--4, .grid--3, .grid--2 { grid-template-columns: minmax(0, 1fr); }
  .grid--5.grid--keep, .grid--4.grid--keep { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

/* ---------------- cards ---------------- */

.card {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow-card);
  min-width: 0;
}

.card__section { padding: 16px; }
.card__section + .card__section { border-top: 1px solid var(--line); }
.card__section--subdued { background: var(--surface-subdued); border-radius: 0 0 var(--radius) var(--radius); }

.card__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  padding: 16px 16px 0;
}

.card__title {
  font-size: 14px;
  font-weight: 650;
  color: var(--text-strong);
}

.card__copy { color: var(--muted); margin-top: 4px; }

/* ---------------- stats ---------------- */

.stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 14px 16px;
}

.stat__label { color: var(--muted); font-size: 13px; }

.stat__value {
  font-size: 26px;
  line-height: 1.2;
  font-weight: 700;
  color: var(--text-strong);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}

.stat__value--sm { font-size: 22px; }
.stat__value small { font-size: 14px; font-weight: 550; color: var(--muted); letter-spacing: 0; }
.stat__value--success { color: var(--success); }
.stat__value--critical { color: var(--critical); }
.stat__note { color: var(--muted); font-size: 12.5px; }
.stat__note--critical { color: var(--critical); }

.stat__icon {
  display: inline-grid;
  place-items: center;
  width: 28px;
  height: 28px;
  margin-bottom: 6px;
  border-radius: 8px;
  background: var(--brand-soft);
  color: var(--brand);
}

/* ---------------- buttons ---------------- */

.btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 32px;
  padding: 6px 12px;
  border: 0;
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--text-strong);
  box-shadow: 0 -1px 0 0 #b5b5b5 inset, 0 0 0 1px rgba(0, 0, 0, 0.1) inset, 0 0.5px 0 1.5px #fff inset;
  font: inherit;
  font-weight: 600;
  font-size: 13px;
  line-height: 1;
  white-space: nowrap;
  text-decoration: none;
  cursor: pointer;
  transition: background-color 0.12s ease;
}

.btn:hover:not(:disabled) { background: var(--surface-hover); }
.btn:active:not(:disabled) { box-shadow: 0 2px 1px 0 rgba(26, 26, 26, 0.2) inset; }
.btn:focus-visible { outline: none; box-shadow: var(--focus); }
.btn:disabled { cursor: not-allowed; opacity: 0.55; }

.btn--primary {
  background: linear-gradient(180deg, #484848 0%, #303030 100%);
  color: #fff;
  box-shadow: 0 -1px 0 1px rgba(0, 0, 0, 0.8) inset, 0 0 0 1px #303030 inset, 0 0.5px 0 1.5px rgba(255, 255, 255, 0.25) inset;
}

.btn--primary:hover:not(:disabled) { background: linear-gradient(180deg, #3a3a3a 0%, #1f1f1f 100%); }

.btn--critical {
  background: linear-gradient(180deg, #e51c00 0%, #c11c00 100%);
  color: #fff;
  box-shadow: 0 -1px 0 1px rgba(142, 31, 11, 0.8) inset, 0 0 0 1px rgba(181, 38, 11, 0.8) inset;
}

.btn--critical-plain { color: var(--critical); }
.btn--large { min-height: 40px; padding: 10px 18px; font-size: 14px; }
.btn--small { min-height: 28px; padding: 4px 10px; font-size: 12.5px; }
.btn--full { width: 100%; }

.btn--plain {
  background: none;
  box-shadow: none;
  color: var(--brand);
  padding: 4px 6px;
  min-height: 0;
}

.btn--plain:hover:not(:disabled) { background: none; text-decoration: underline; }

.link {
  color: var(--brand);
  font-weight: 550;
  text-decoration: none;
  background: none;
  border: 0;
  padding: 0;
  font: inherit;
  cursor: pointer;
}

.link:hover { text-decoration: underline; }
.link:focus-visible { outline: none; box-shadow: var(--focus); border-radius: 4px; }

/* spinner on a busy button (shopifyClient.js toggles .is-loading) */
@keyframes spin { to { transform: rotate(360deg); } }

.is-loading { color: transparent !important; pointer-events: none; }

.is-loading::after {
  content: "";
  position: absolute;
  inset: 50% auto auto 50%;
  width: 14px;
  height: 14px;
  margin: -7px 0 0 -7px;
  border: 2px solid var(--subtle);
  border-right-color: transparent;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}

.btn--primary.is-loading::after,
.btn--critical.is-loading::after { border-color: #fff; border-right-color: transparent; }

@media (prefers-reduced-motion: reduce) {
  .is-loading::after, .is-navigating::before { animation-duration: 2.5s; }
  .progress__fill { transition: none !important; }
}

/* ---------------- badges ---------------- */

.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 8px;
  border-radius: 8px;
  background: var(--neutral-bg);
  color: var(--text);
  font-size: 12px;
  font-weight: 550;
  line-height: 18px;
  white-space: nowrap;
}

.badge--success { background: var(--success-bg); color: #0c5132; }
.badge--info { background: var(--info-bg); color: var(--info); }
.badge--warning { background: var(--warning-bg); color: #4f4700; }
.badge--critical { background: var(--critical-bg); color: #8e1f0b; }
.badge--attention { background: #ffd6a4; color: #5e4200; }
.badge--brand { background: var(--brand-soft); color: var(--brand); }

.badge__dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
}

.badge--pulse .badge__dot { animation: pulse 1.4s ease-in-out infinite; }

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.25; }
}

/* ---------------- banners ---------------- */

.banner {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 12px 14px;
  border-radius: var(--radius);
  background: var(--info-bg);
  color: #00324d;
  box-shadow: inset 0 0 0 1px rgba(0, 82, 124, 0.12);
}

.banner .icon { flex: 0 0 auto; margin-top: 1px; }
.banner__body { flex: 1 1 auto; min-width: 0; }
.banner__title { font-weight: 650; }
.banner__actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.banner--inline { align-items: center; }
.banner--inline .banner__actions { margin: 0; }
.banner--success { background: var(--success-soft); color: #0c5132; box-shadow: inset 0 0 0 1px rgba(12, 122, 67, 0.18); }
.banner--warning { background: var(--warning-soft); color: #4f4700; box-shadow: inset 0 0 0 1px rgba(138, 97, 22, 0.2); }
.banner--critical { background: var(--critical-soft); color: #8e1f0b; box-shadow: inset 0 0 0 1px rgba(179, 38, 30, 0.18); }
.banner--brand { background: var(--brand-soft); color: var(--brand-hover); box-shadow: inset 0 0 0 1px var(--brand-line); }

/* ---------------- progress ---------------- */

.progress {
  position: relative;
  height: 8px;
  border-radius: 999px;
  background: #e3e3e3;
  overflow: hidden;
}

.progress--thin { height: 6px; }
.progress--thick { height: 10px; }

.progress__fill {
  display: block;
  height: 100%;
  width: 0;
  border-radius: inherit;
  background: var(--primary);
  transition: width 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.progress__fill--success { background: var(--success); }
.progress__fill--brand { background: var(--brand); }
.progress__fill--warning { background: #e0b100; }
.progress__fill--critical { background: var(--critical); }

.progress--running .progress__fill {
  background-image: linear-gradient(45deg, rgba(255, 255, 255, 0.18) 25%, transparent 25%, transparent 50%, rgba(255, 255, 255, 0.18) 50%, rgba(255, 255, 255, 0.18) 75%, transparent 75%);
  background-size: 16px 16px;
  animation: stripes 0.9s linear infinite;
}

@keyframes stripes { to { background-position: 16px 0; } }

/* ---------------- tables ---------------- */

.table-wrap { overflow-x: auto; }

.table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

.table th {
  padding: 8px 12px;
  background: var(--surface-subdued);
  color: var(--muted);
  font-weight: 550;
  text-align: left;
  white-space: nowrap;
  border-bottom: 1px solid var(--line);
}

.table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--line);
  vertical-align: middle;
}

.table tr:last-child td { border-bottom: 0; }
.table .num, .table th.num { text-align: right; }
.table tbody tr[data-navigate] { cursor: pointer; }
.table tbody tr[data-navigate]:hover { background: var(--surface-hover); }
.table tbody tr[data-navigate]:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--brand); }
.table__primary { font-weight: 600; color: var(--text-strong); }
.table__secondary { display: block; color: var(--muted); font-size: 12.5px; }
.table__id { color: var(--muted); font-variant-numeric: tabular-nums; }
.card > .table-wrap:first-child .table th:first-child { border-top-left-radius: var(--radius); }
.card > .table-wrap:first-child .table th:last-child { border-top-right-radius: var(--radius); }

.cell-progress { display: grid; gap: 4px; min-width: 120px; }

@media (max-width: 640px) {
  .table--stack thead { display: none; }
  .table--stack tr { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 12px; border-bottom: 1px solid var(--line); }
  .table--stack td { padding: 0; border: 0; }
  .table--stack td[data-label]::before { content: attr(data-label) ": "; color: var(--muted); }
  .table--stack .hide-sm { display: none; }
}

/* ---------------- filter tabs ---------------- */

.tabs {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  padding: 8px;
  border-bottom: 1px solid var(--line);
}

.tabs__tab {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border: 0;
  border-radius: var(--radius-sm);
  background: none;
  color: var(--muted);
  font: inherit;
  font-weight: 600;
  font-size: 13px;
  cursor: pointer;
}

.tabs__tab:hover { background: var(--surface-hover); color: var(--text-strong); }
.tabs__tab:focus-visible { outline: none; box-shadow: var(--focus); }
.tabs__tab--on { background: var(--neutral-bg); color: var(--text-strong); }
.tabs__count { color: var(--subtle); font-weight: 550; }

.tabs--standalone { padding: 0; border: 0; margin-bottom: 16px; }

/* ---------------- empty state ---------------- */

.empty {
  display: grid;
  justify-items: center;
  gap: 8px;
  padding: 48px 24px;
  text-align: center;
}

.empty__art {
  display: grid;
  place-items: center;
  width: 64px;
  height: 64px;
  margin-bottom: 8px;
  border-radius: 18px;
  background: var(--brand-soft);
  color: var(--brand);
}

.empty__title { font-size: 16px; font-weight: 650; color: var(--text-strong); }
.empty__copy { color: var(--muted); max-width: 420px; }
.empty .row { margin-top: 8px; justify-content: center; }

/* ---------------- icons ---------------- */

.icon { flex: 0 0 auto; display: inline-block; vertical-align: middle; }

/* ---------------- forms ---------------- */

.field { display: grid; gap: 6px; }
.field + .field { margin-top: 14px; }

.field__label {
  font-weight: 550;
  color: var(--text-strong);
  font-size: 13px;
}

.field__help { color: var(--muted); font-size: 12.5px; }
.field__error { color: var(--critical); font-size: 12.5px; }

.input,
.select {
  width: 100%;
  min-height: 36px;
  padding: 7px 12px;
  border: 1px solid #8a8a8a;
  border-top-color: #898f94;
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--text-strong);
  font: inherit;
}

.input--mono { font-family: var(--mono); font-size: 13px; }
.input:hover, .select:hover { border-color: #616161; }
.input:focus, .select:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
.input[aria-invalid="true"] { border-color: var(--critical); background: var(--critical-soft); }
.input--sm, .select--sm { min-height: 30px; padding: 4px 8px; font-size: 13px; width: auto; }

.input-group { position: relative; }
.input-group .input { padding-right: 64px; }

.input-group__toggle {
  position: absolute;
  inset: 4px 4px 4px auto;
  padding: 0 8px;
  border: 0;
  border-radius: 6px;
  background: var(--surface-subdued);
  color: var(--muted);
  font: inherit;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}

.check {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  cursor: pointer;
}

.check input {
  flex: 0 0 auto;
  width: 16px;
  height: 16px;
  margin: 2px 0 0;
  accent-color: var(--primary);
  cursor: pointer;
}

.check input:disabled { cursor: not-allowed; }
.check:has(input:disabled) { cursor: not-allowed; opacity: 0.6; }
.check__text { display: grid; gap: 1px; }
.check__label { color: var(--text-strong); font-weight: 550; }
.check__help { color: var(--muted); font-size: 12.5px; }

.radio-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 16px;
}

.radio-row__label { color: var(--muted); min-width: 170px; }
.radio-row .check { align-items: center; }
.radio-row .check input { margin: 0; }
.radio-row + .radio-row, .check + .check, .radio-row + .check, .check + .radio-row { margin-top: 10px; }

.fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
.fieldset__legend { padding: 0; margin-bottom: 10px; font-weight: 650; color: var(--text-strong); }

/* ---------------- wizard ---------------- */

.stepper {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 6px;
  margin: 0 0 16px;
  padding: 0;
  list-style: none;
  counter-reset: step;
}

.stepper__item {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  background: var(--surface);
  box-shadow: var(--shadow-card);
  color: var(--subtle);
  font-size: 13px;
  font-weight: 550;
}

.stepper__item > span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.stepper__num {
  display: inline-grid;
  place-items: center;
  flex: 0 0 auto;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--neutral-bg);
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
}

.stepper__item--done { color: var(--success); cursor: pointer; }
.stepper__item--done:hover { background: var(--success-soft); }
.stepper__item--done .stepper__num { background: var(--success-bg); color: var(--success); }
.stepper__item--current { background: var(--primary); color: #fff; box-shadow: none; }
.stepper__item--current .stepper__num { background: rgba(255, 255, 255, 0.18); color: #fff; }

@media (max-width: 720px) {
  .stepper__item > span:last-child { display: none; }
  .stepper__item { justify-content: center; }
  .stepper__item--current > span:last-child { display: inline; }
  .stepper { grid-template-columns: repeat(5, auto); justify-content: start; }
}

.wizard-title { font-size: 18px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.01em; }
.wizard-sub { color: var(--muted); margin-top: 4px; }

.wizard-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
  padding: 12px 16px;
  border-top: 1px solid var(--line);
  background: var(--surface-subdued);
  border-radius: 0 0 var(--radius) var(--radius);
}

.wizard-footer__actions { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }

/* platform tiles */
.tiles {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
  gap: 10px;
}

.tile {
  position: relative;
  display: grid;
  justify-items: center;
  gap: 6px;
  padding: 18px 12px 16px;
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: inset 0 0 0 1px var(--line-strong);
  text-align: center;
  cursor: pointer;
  transition: box-shadow 0.12s ease, background 0.12s ease;
}

.tile input { position: absolute; opacity: 0; pointer-events: none; }
.tile:hover { background: var(--surface-subdued); }
.tile:has(input:focus-visible) { box-shadow: inset 0 0 0 1px var(--line-strong), var(--focus); }
.tile:has(input:checked) { box-shadow: inset 0 0 0 2px var(--primary); background: var(--surface); }
.tile--disabled { cursor: not-allowed; background: var(--surface-subdued); box-shadow: inset 0 0 0 1px var(--line); }
.tile--disabled:hover { background: var(--surface-subdued); }
.tile--disabled .tile__name, .tile--disabled .tile__logo { opacity: 0.45; }

.tile__logo {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border-radius: 12px;
  color: #fff;
  font-weight: 800;
  font-size: 15px;
  letter-spacing: -0.02em;
}

.tile__logo--woocommerce { background: #7f54b3; }
.tile__logo--wordpress { background: #21759b; }
.tile__logo--csv { background: #3a7d44; }
.tile__logo--magento { background: #ee672f; }
.tile__logo--bigcommerce { background: #34313f; }
.tile__name { font-weight: 650; color: var(--text-strong); }
.tile__blurb { color: var(--muted); font-size: 12.5px; }
.tile__check {
  position: absolute;
  top: 8px;
  right: 8px;
  display: none;
  color: var(--primary);
}
.tile:has(input:checked) .tile__check { display: block; }

/* connection test result */
.scan {
  border-radius: var(--radius);
  background: var(--surface-subdued);
  box-shadow: inset 0 0 0 1px var(--line);
  padding: 14px 16px;
  min-height: 100%;
}

.scan__status { display: flex; align-items: center; gap: 6px; font-weight: 650; }
.scan__status--ok { color: var(--success); }
.scan__status--error { color: var(--critical); }
.scan__list { margin: 10px 0 0; padding: 0; list-style: none; }

.scan__list li {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 7px 0;
  border-top: 1px solid var(--line);
  font-variant-numeric: tabular-nums;
}

.scan__list li:first-child { border-top: 0; }

.scan__placeholder {
  display: grid;
  place-items: center;
  height: 100%;
  min-height: 180px;
  color: var(--subtle);
  text-align: center;
  gap: 8px;
}

/* data type picker */
.pick {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}

@media (max-width: 640px) { .pick { grid-template-columns: minmax(0, 1fr); } }

.pick__item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  background: var(--surface);
  box-shadow: inset 0 0 0 1px var(--line-strong);
  cursor: pointer;
}

.pick__item:hover { background: var(--surface-subdued); }
.pick__item:has(input:checked) { box-shadow: inset 0 0 0 1.5px var(--primary); }
.pick__item:has(input:disabled) { cursor: not-allowed; background: var(--surface-subdued); box-shadow: inset 0 0 0 1px var(--line); }
.pick__item input { width: 16px; height: 16px; margin: 0; accent-color: var(--primary); }
.pick__text { flex: 1 1 auto; min-width: 0; }
.pick__name { font-weight: 650; color: var(--text-strong); }
.pick__detail { color: var(--muted); font-size: 12.5px; }
.pick__count { color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 550; }

/* review */
.kv { display: grid; gap: 12px; }
.kv__label { color: var(--muted); font-size: 12.5px; }
.kv__value { color: var(--text-strong); font-weight: 600; margin-top: 1px; overflow-wrap: anywhere; }

.flow {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.flow__node {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  background: var(--surface-subdued);
  box-shadow: inset 0 0 0 1px var(--line);
  min-width: 0;
}

.flow__arrow { color: var(--subtle); }

/* ---------------- setup ---------------- */

.setup-step {
  display: flex;
  gap: 14px;
  padding: 16px;
}

.setup-step + .setup-step { border-top: 1px solid var(--line); }

.setup-step__mark {
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 1.5px dashed var(--line-strong);
  color: var(--muted);
  font-weight: 700;
  font-size: 13px;
}

.setup-step--done .setup-step__mark { border: 0; background: var(--success); color: #fff; }
.setup-step--current .setup-step__mark { border: 1.5px solid var(--primary); color: var(--text-strong); }
.setup-step__body { flex: 1 1 auto; min-width: 0; display: grid; gap: 4px; }
.setup-step__title { font-size: 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 650; color: var(--text-strong); }
.setup-step--done .setup-step__title { color: var(--success); }
.setup-step__actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

.hero {
  display: grid;
  gap: 6px;
  padding: 20px;
}

.hero__title { font-size: 18px; font-weight: 700; color: var(--text-strong); }

/* ---------------- running banner ---------------- */

.live {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  padding: 12px 16px;
  border-radius: var(--radius);
  background: var(--info-bg);
  box-shadow: inset 0 0 0 1px rgba(0, 82, 124, 0.12);
  color: #00324d;
}

.live__text { flex: 1 1 260px; min-width: 0; font-weight: 600; }
.live .progress { flex: 1 1 160px; max-width: 260px; background: rgba(0, 82, 124, 0.15); }
.live .progress__fill { background: var(--info); }

/* ---------------- progress screen ---------------- */

.overall__numbers {
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
  margin: 2px 0 12px;
}

.overall__count { font-size: 28px; font-weight: 750; color: var(--text-strong); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.overall__meta { color: var(--muted); font-weight: 600; }
.phase-note { color: var(--muted); font-size: 12.5px; }

/* ---------------- results ---------------- */

.result-hero {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  border-radius: var(--radius);
  font-weight: 600;
}

/* ---------------- plans ---------------- */

.plans {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 12px;
}

.plan {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 18px;
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow-card);
}

.plan--current { box-shadow: inset 0 0 0 2px var(--primary); }
.plan__head { display: flex; align-items: center; gap: 8px; }
.plan__name { font-weight: 700; color: var(--text-strong); font-size: 15px; }
.plan__price { font-size: 28px; font-weight: 750; color: var(--text-strong); letter-spacing: -0.02em; }
.plan__price small { font-size: 13px; font-weight: 550; color: var(--muted); letter-spacing: 0; }
.plan__limit { color: var(--muted); font-size: 13px; margin-top: -6px; }
.plan__features { display: grid; align-content: start; gap: 6px; margin: 4px 0 0; padding: 0; list-style: none; flex: 1 1 auto; }
.plan__features li { display: flex; gap: 8px; align-items: flex-start; }
.plan__features .icon { color: var(--success); margin-top: 1px; }
.plan__current { display: flex; align-items: center; gap: 6px; color: var(--success); font-weight: 650; min-height: 32px; }

/* ---------------- usage meter ---------------- */

.meter { display: grid; gap: 6px; }
.meter__head { display: flex; justify-content: space-between; gap: 8px; }

/* ---------------- help ---------------- */

.howto {
  counter-reset: howto;
  display: grid;
  margin: 0;
  padding: 0;
  list-style: none;
}

.howto__item {
  display: flex;
  gap: 14px;
  padding: 16px;
}

.howto__item + .howto__item { border-top: 1px solid var(--line); }

.howto__num {
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--brand-soft);
  color: var(--brand);
  font-weight: 700;
  font-size: 13px;
}

.howto__title { font-weight: 650; color: var(--text-strong); }
.howto__detail { color: var(--muted); margin-top: 2px; }

.path {
  display: inline-flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
  margin-top: 6px;
  font-size: 12.5px;
}

.path span {
  padding: 2px 8px;
  border-radius: 6px;
  background: var(--surface-subdued);
  box-shadow: inset 0 0 0 1px var(--line);
  color: var(--text-strong);
  font-weight: 550;
}

.path .icon { color: var(--subtle); }

.faq__item + .faq__item { border-top: 1px solid var(--line); }

.faq__question {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 16px;
  font-weight: 600;
  color: var(--text-strong);
  cursor: pointer;
  list-style: none;
}

.faq__question::-webkit-details-marker { display: none; }
.faq__question:hover { background: var(--surface-subdued); }
.faq__question:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--brand); }
.faq__question .icon { color: var(--muted); transition: transform 0.15s ease; }
.faq__item[open] .faq__question .icon { transform: rotate(180deg); }
.faq__answer { padding: 0 16px 16px; color: var(--muted); max-width: 70ch; white-space: pre-line; }

/* ---------------- footer note ---------------- */

.footnote {
  display: block;
  margin-top: 20px;
  color: var(--subtle);
  font-size: 12.5px;
  text-align: center;
}

.footnote .icon { margin-right: 4px; vertical-align: -2px; }

/* ---------------- install page ---------------- */

.install {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px 16px;
}

.install__card { width: 100%; max-width: 440px; }

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
  font-weight: 700;
  color: var(--text-strong);
  font-size: 15px;
}

.brand__mark {
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: var(--brand);
  color: #fff;
}

/* ---------------- dialogs (fallback outside the admin) ---------------- */

s-modal:not(:defined) { display: none; }

s-modal:not(:defined)[open] {
  display: block;
  position: fixed;
  inset: 50% auto auto 50%;
  transform: translate(-50%, -50%);
  z-index: 1001;
  width: min(92vw, 440px);
  padding: 20px;
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
}

.modal__copy { margin: 0 0 12px; color: var(--text); white-space: pre-line; }

/* App Bridge moves the menu into the admin sidebar; never render it in-page. */
s-app-nav { display: none; }


/* ---------- the Shopify admin frame around the app ---------- */
body { background: #1a1a1a; }
.proto-top {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 16px;
  height: 56px; padding: 0 16px;
  background: #1a1a1a; color: #e3e3e3;
}

.proto-logo span { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 7px; background: #95bf47; color: #1a1a1a; font-weight: 800; }
.proto-search { flex: 1 1 auto; max-width: 560px; margin: 0 auto; height: 34px; border-radius: 10px; background: #303030; color: #8a8a8a; display: flex; align-items: center; padding: 0 12px; font-size: 13px; }
.proto-store { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.proto-store b { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: #0b5368; color: #fff; }
.proto-shell { display: flex; min-height: calc(100vh - 56px); background: var(--canvas); border-radius: 12px 12px 0 0; overflow: hidden; }

.proto-side a { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 8px; color: #303030; font-weight: 550; text-decoration: none; cursor: pointer; }
.proto-side a.dim { color: #616161; font-weight: 500; cursor: default; }
.proto-side a:not(.dim):hover { background: #e3e3e3; }
.proto-side a.is-active { background: #fff; box-shadow: 0 1px 0 rgba(0,0,0,.05); }
.proto-side .proto-app { margin-top: 14px; padding: 6px 10px; color: #616161; font-size: 12px; font-weight: 650; }
.proto-side .proto-app-name { display: flex; align-items: center; gap: 8px; padding: 6px 10px; font-weight: 650; color: #303030; }
.proto-side .proto-app-name i { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 5px; background: #0b5368; color: #fff; font-style: normal; font-size: 11px; }
.proto-side .sub { padding-left: 38px; }
#view { flex: 1 1 auto; min-width: 0; }
@media (max-width: 860px) { .proto-side { display: none; } .proto-search { display: none; } }

/* ---------- prototype controls ---------- */
.proto-fab { position: fixed; left: 16px; bottom: 16px; z-index: 90; }
.proto-fab__btn { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border: 0; border-radius: 999px; background: #0b5368; color: #fff; font: 600 13px var(--font); box-shadow: 0 6px 20px rgba(0,0,0,.25); cursor: pointer; }
.proto-fab__btn small { opacity: .75; font-weight: 500; font-family: var(--mono); }
.proto-menu { position: absolute; left: 0; bottom: 48px; width: 290px; max-height: 70vh; overflow: auto; padding: 8px; border-radius: 12px; background: #fff; box-shadow: 0 12px 40px rgba(0,0,0,.25); }
.proto-menu h4 { margin: 10px 8px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: #8a8a8a; }
.proto-menu button { display: block; width: 100%; padding: 7px 10px; border: 0; border-radius: 8px; background: none; text-align: left; font: 500 13px var(--font); color: #303030; cursor: pointer; }
.proto-menu button:hover { background: #f3f3f3; }
.proto-menu .reset { color: #b3261e; border-top: 1px solid #e3e3e3; border-radius: 0; margin-top: 6px; }

.proto-modal { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 16px; background: rgba(0,0,0,.45); }
.proto-modal__card { width: min(100%, 460px); border-radius: 14px; background: #fff; box-shadow: 0 24px 60px rgba(0,0,0,.3); overflow: hidden; }
.proto-modal__head { padding: 14px 16px; font-weight: 650; font-size: 15px; color: #1a1a1a; border-bottom: 1px solid #e3e3e3; background: #f7f7f7; }
.proto-modal__body { padding: 16px; display: grid; gap: 10px; color: #303030; }
.proto-modal__foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid #e3e3e3; }

.proto-toast { position: fixed; left: 50%; bottom: 24px; z-index: 110; transform: translateX(-50%); padding: 10px 16px; border-radius: 10px; background: #1a1a1a; color: #fff; font-size: 13.5px; font-weight: 550; box-shadow: 0 8px 24px rgba(0,0,0,.25); transition: opacity .3s, transform .3s; }
.proto-toast--error { background: #b3261e; }
.proto-toast--out { opacity: 0; transform: translate(-50%, 8px); }
</style>

n\u003cdiv class=\"banner banner--critical\" id=\"page-error\" role=\"alert\" hidden\u003e\n  \n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"M12 3.5 2.5 20h19L12 3.5z\"/\u003e\u003cpath d=\"M12 10v4.5\"/\u003e\u003cpath d=\"M12 17.5v.01\"/\u003e\u003c/svg\u003e\n\n  \u003cdiv class=\"banner__body\" data-error-text\u003e\u003c/div\u003e\n\u003c/div\u003e\n\n\n    \u003cform class=\"card\" id=\"wizard\" data-step=\"1\" data-id=\"13\" novalidate style=\"margin-top:12px\"\u003e\n\n      \n        \n        \u003cdiv class=\"card__section\"\u003e\n          \u003ch2 class=\"wizard-title\"\u003eWhere are you migrating from?\u003c/h2\u003e\n          \u003cp class=\"wizard-sub\"\u003ePick the platform your current store runs on.\u003c/p\u003e\n        \u003c/div\u003e\n        \u003cdiv class=\"card__section\"\u003e\n          \u003cdiv class=\"tiles\" role=\"radiogroup\" aria-label=\"Platform\"\u003e\n            \n              \u003clabel class=\"tile\"\u003e\n                \u003cinput type=\"radio\" name=\"platform\" value=\"woocommerce\"  checked\u003e\n                \u003cspan class=\"tile__check\"\u003e\n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/\u003e\u003cpath d=\"m8.5 12 2.5 2.5 4.5-5\"/\u003e\u003c/svg\u003e\n\u003c/span\u003e\n                \u003cspan class=\"tile__logo tile__logo--woocommerce\"\u003eWo\u003c/span\u003e\n                \u003cspan class=\"tile__name\"\u003eWooCommerce\u003c/span\u003e\n                \u003cspan class=\"tile__blurb\"\u003eProducts, customers, orders\u003c/span\u003e\n              \u003c/label\u003e\n            \n              \u003clabel class=\"tile\"\u003e\n                \u003cinput type=\"radio\" name=\"platform\" value=\"wordpress\"  \u003e\n                \u003cspan class=\"tile__check\"\u003e\n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/\u003e\u003cpath d=\"m8.5 12 2.5 2.5 4.5-5\"/\u003e\u003c/svg\u003e\n\u003c/span\u003e\n                \u003cspan class=\"tile__logo tile__logo--wordpress\"\u003eWo\u003c/span\u003e\n                \u003cspan class=\"tile__name\"\u003eWordPress\u003c/span\u003e\n                \u003cspan class=\"tile__blurb\"\u003ePages, blog posts\u003c/span\u003e\n              \u003c/label\u003e\n            \n              \u003clabel class=\"tile tile--disabled\"\u003e\n                \u003cinput type=\"radio\" name=\"platform\" value=\"csv\" disabled \u003e\n                \u003cspan class=\"tile__check\"\u003e\n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/\u003e\u003cpath d=\"m8.5 12 2.5 2.5 4.5-5\"/\u003e\u003c/svg\u003e\n\u003c/span\u003e\n                \u003cspan class=\"tile__logo tile__logo--csv\"\u003eCS\u003c/span\u003e\n                \u003cspan class=\"tile__name\"\u003eCSV file\u003c/span\u003e\n                \u003cspan class=\"tile__blurb\"\u003eComing soon\u003c/span\u003e\n              \u003c/label\u003e\n            \n              \u003clabel class=\"tile tile--disabled\"\u003e\n                \u003cinput type=\"radio\" name=\"platform\" value=\"magento\" disabled \u003e\n                \u003cspan class=\"tile__check\"\u003e\n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/\u003e\u003cpath d=\"m8.5 12 2.5 2.5 4.5-5\"/\u003e\u003c/svg\u003e\n\u003c/span\u003e\n                \u003cspan class=\"tile__logo tile__logo--magento\"\u003eMa\u003c/span\u003e\n                \u003cspan class=\"tile__name\"\u003eMagento\u003c/span\u003e\n                \u003cspan class=\"tile__blurb\"\u003eComing soon\u003c/span\u003e\n              \u003c/label\u003e\n            \n              \u003clabel class=\"tile tile--disabled\"\u003e\n                \u003cinput type=\"radio\" name=\"platform\" value=\"bigcommerce\" disabled \u003e\n                \u003cspan class=\"tile__check\"\u003e\n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/\u003e\u003cpath d=\"m8.5 12 2.5 2.5 4.5-5\"/\u003e\u003c/svg\u003e\n\u003c/span\u003e\n                \u003cspan class=\"tile__logo tile__logo--bigcommerce\"\u003eBi\u003c/span\u003e\n                \u003cspan class=\"tile__name\"\u003eBigCommerce\u003c/span\u003e\n                \u003cspan class=\"tile__blurb\"\u003eComing soon\u003c/span\u003e\n              \u003c/label\u003e\n            \n          \u003c/div\u003e\n        \u003c/div\u003e\n\n      \n\n      \u003cdiv class=\"wizard-footer\"\u003e\n        \u003cbutton class=\"btn btn--plain btn--critical-plain\" type=\"button\" style=\"color:var(--critical)\"\n          data-post=\"/migrations/13/discard\" data-then=\"/migrations\"\n          data-confirm=\"Discard this draft?\\n\\nNothing has been migrated yet, so nothing is lost.\" data-confirm-label=\"Discard\" data-destructive\u003e\n          Discard\n        \u003c/button\u003e\n        \u003cdiv class=\"wizard-footer__actions\"\u003e\n          \n          \n            \u003cbutton class=\"btn btn--primary\" type=\"submit\" id=\"continue\" \u003eContinue\u003c/button\u003e\n          \n        \u003c/div\u003e\n      \u003c/div\u003e\n    \u003c/form\u003e\n\n    \u003cp class=\"footnote\"\u003e\n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003crect x=\"4.5\" y=\"10.5\" width=\"15\" height=\"10\" rx=\"2\"/\u003e\u003cpath d=\"M8 10.5V7.5a4 4 0 0 1 8 0v3\"/\u003e\u003c/svg\u003e\n Keys are encrypted at rest. Your data is never stored in our database — only counts and ID pairs.\u003c/p\u003e\n  \u003c/main\u003e","scripts":["\n    (function () {\n      var form = document.getElementById(\"wizard\");\n      var step = Number(form.dataset.step);\n      var id = form.dataset.id;\n      var base = \"/migrations/\" + id;\n\n      function values() {\n        var data = { step: step };\n        if (step === 1) {\n          var chosen = form.querySelector(\"input[name=platform]:checked\");\n          data.platform = chosen ? chosen.value : \"\";\n        }\n        if (step === 3) {\n          data.entities = Array.prototype.map.call(form.querySelectorAll(\"input[name=entities]:checked\"), function (box) { return box.value; });\n          var range = form.querySelector(\"input[name=orders_range]:checked\");\n          data.orders_range = range ? range.value : \"all\";\n          data.orders_from = (form.querySelector(\"[name=orders_from]\") || {}).value || \"\";\n          data.orders_to = (form.querySelector(\"[name=orders_to]\") || {}).value || \"\";\n        }\n        if (step === 4) {\n          data.order_status_map = {};\n          Array.prototype.forEach.call(form.elements, function (field) {\n            if (!field.name) return;\n            if (field.name.indexOf(\"map.\") === 0) {\n              var parts = field.name.split(\".\");\n              data.order_status_map[parts[1]] = data.order_status_map[parts[1]] || {};\n              data.order_status_map[parts[1]][parts[2]] = field.value;\n            } else if (field.type === \"checkbox\") {\n              data[field.name] = field.checked;\n            } else if (field.type === \"radio\") {\n              if (field.checked) data[field.name] = field.value;\n            }\n          });\n          // Unrendered sections keep their defaults on the server.\n          [\"publish_online_store\", \"send_invites\", \"keep_order_numbers\", \"silent_orders\"].forEach(function (name) {\n            if (!(name in data)) data[name] = {\"product_status\":\"same\",\"sku_exists\":\"skip\",\"publish_online_store\":true,\"extra_attributes\":\"skip\",\"email_exists\":\"skip\",\"send_invites\":false,\"keep_order_numbers\":false,\"silent_orders\":true,\"orders_range\":\"range\",\"orders_from\":\"2024-01-01\",\"orders_to\":null,\"page_status\":\"same\",\"order_status_map\":{\"completed\":{\"payment\":\"PAID\",\"fulfilment\":\"FULFILLED\"},\"processing\":{\"payment\":\"PAID\",\"fulfilment\":\"UNFULFILLED\"},\"on-hold\":{\"payment\":\"PENDING\",\"fulfilment\":\"UNFULFILLED\"},\"pending\":{\"payment\":\"PENDING\",\"fulfilment\":\"UNFULFILLED\"},\"refunded\":{\"payment\":\"REFUNDED\",\"fulfilment\":\"UNFULFILLED\"},\"cancelled\":{\"payment\":\"VOIDED\",\"fulfilment\":\"UNFULFILLED\"},\"failed\":{\"payment\":\"VOIDED\",\"fulfilment\":\"UNFULFILLED\"}},\"platform\":\"woocommerce\"}[name];\n          });\n        }\n        return data;\n      }\n\n      form.addEventListener(\"submit\", async function (event) {\n        event.preventDefault();\n        window.appClearError();\n        var button = document.getElementById(\"continue\");\n        if (!button || button.disabled) return;\n        try {\n          var result = await window.appPostJson(base + \"/wizard\", values(), button);\n          window.appNavigate(base + \"?step=\" + result.next);\n        } catch (error) {\n          window.appPageError(error.message);\n        }\n      });\n\n      /* ---- step 1: choosing a tile enables Continue ---- */\n      if (step === 1) {\n        var cont = document.getElementById(\"continue\");\n        var update = function () { cont.disabled = !form.querySelector(\"input[name=platform]:checked\"); };\n        form.addEventListener(\"change\", update);\n        update();\n      }\n\n      /* ---- step 2: test connection ---- */\n      var test = document.getElementById(\"test-connection\");\n      if (test) {\n        var scan = document.getElementById(\"scan\");\n        var escape = function (text) { var div = document.createElement(\"div\"); div.textContent = text; return div.innerHTML; };\n\n        test.addEventListener(\"click\", async function () {\n          window.appClearError();\n          var body = {};\n          [\"base_url\", \"consumer_key\", \"consumer_secret\", \"username\", \"app_password\"].forEach(function (name) {\n            var field = form.querySelector(\"[name=\" + name + \"]\");\n            if (field) body[name] = field.value.trim();\n          });\n          if (!body.base_url) {\n            window.appPageError(\"Enter your store's address first.\");\n            form.querySelector(\"[name=base_url]\").focus();\n            return;\n          }\n          scan.innerHTML = '\u003cdiv class=\"scan__placeholder\"\u003e\u003cdiv\u003e\u003cspan class=\"btn is-loading\" style=\"box-shadow:none;background:none;width:24px\"\u003e\u003c/span\u003e\u003cp\u003eConnecting and counting your data…\u003cbr\u003e\u003cspan style=\"font-size:12.5px\"\u003eThis can take a few seconds on slower hosting.\u003c/span\u003e\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e';\n          try {\n            var result = await window.appPostJson(base + \"/connect\", body, test);\n            scan.innerHTML =\n              '\u003cdiv class=\"muted\" style=\"font-size:12.5px\"\u003eConnection result\u003c/div\u003e' +\n              '\u003cdiv class=\"scan__status scan__status--ok\"\u003e✓ Connected — ' + escape(result.version || \"\") + '\u003c/div\u003e' +\n              '\u003cdiv class=\"muted\" style=\"margin-top:6px;font-size:12.5px\"\u003eWe found in your store:\u003c/div\u003e' +\n              '\u003cul class=\"scan__list\"\u003e' + result.counts.map(function (row) {\n                return \"\u003cli\u003e\u003cspan\u003e\" + escape(row.label) + \"\u003c/span\u003e\u003cstrong\u003e\" + row.count.toLocaleString(\"en-US\") + \"\u003c/strong\u003e\u003c/li\u003e\";\n              }).join(\"\") + \"\u003c/ul\u003e\";\n            [\"consumer_key\", \"consumer_secret\", \"app_password\"].forEach(function (name) {\n              var field = form.querySelector(\"[name=\" + name + \"]\");\n              if (field) { field.value = \"\"; field.placeholder = name === \"consumer_key\" ? result.hint + \"  (saved)\" : \"(saved)\"; }\n            });\n            form.querySelector(\"[name=base_url]\").value = result.base_url;\n            document.getElementById(\"continue\").disabled = false;\n            window.appToast(\"Connected\");\n          } catch (error) {\n            scan.innerHTML = '\u003cdiv class=\"muted\" style=\"font-size:12.5px\"\u003eConnection result\u003c/div\u003e\u003cdiv class=\"scan__status scan__status--error\"\u003e✕ Could not connect\u003c/div\u003e\u003cp style=\"margin-top:8px\"\u003e' + escape(error.message) + \"\u003c/p\u003e\";\n            document.getElementById(\"continue\").disabled = true;\n          }\n        });\n      }\n\n      /* ---- step 3: orders pull in products + customers; the date range follows orders ---- */\n      if (step === 3) {\n        var boxes = function (key) { return form.querySelector(\"input[name=entities][value=\" + key + \"]\"); };\n        var range = document.getElementById(\"orders-range\");\n        form.addEventListener(\"change\", function (event) {\n          var orders = boxes(\"orders\");\n          if (event.target === orders \u0026\u0026 orders.checked) {\n            [\"products\", \"customers\"].forEach(function (key) { var box = boxes(key); if (box \u0026\u0026 !box.disabled) box.checked = true; });\n          }\n          if (orders \u0026\u0026 orders.checked \u0026\u0026 [\"products\", \"customers\"].some(function (key) { var box = boxes(key); return box \u0026\u0026 event.target === box \u0026\u0026 !box.checked; })) {\n            orders.checked = false;\n            window.appToast(\"Orders need their products and customers, so Orders was unticked too.\");\n          }\n          if (range) range.hidden = !(orders \u0026\u0026 orders.checked);\n          if (event.target.name === \"orders_from\" || event.target.name === \"orders_to\") {\n            var r = form.querySelector(\"input[name=orders_range][value=range]\");\n            if (r) r.checked = true;\n          }\n        });\n      }\n    })();\n  "]},"wizard-2":{"title":"New migration","html":"\u003cmain class=\"page page--narrow\"\u003e\n    \u003cbutton class=\"back-link\" type=\"button\" data-navigate=\"/migrations\"\u003e\n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"M19 12H5\"/\u003e\u003cpath d=\"m11 18-6-6 6-6\"/\u003e\u003c/svg\u003e\n Migrations\u003c/button\u003e\n    \u003cheader class=\"page-header\"\u003e\n      \u003cdiv\u003e\n        \u003ch1 class=\"page-header__title\"\u003eNew migration \u003cspan class=\"badge\"\u003eDraft #13\u003c/span\u003e\u003c/h1\u003e\n        \u003cp class=\"page-header__sub\"\u003eYour choices are saved as you go — leave any time and continue later.\u003c/p\u003e\n      \u003c/div\u003e\n    \u003c/header\u003e\n\n    \u003col class=\"stepper\" aria-label=\"Steps\"\u003e\n      \n        \u003cli class=\"stepper__item stepper__item--done\"\n          data-navigate=\"/migrations/13?step=1\" role=\"link\" t data-navigate=\"/migrations/13?step=1\"\u003eBack\u003c/button\u003e\n          \n          \n            \u003cbutton class=\"btn btn--primary\" type=\"submit\" id=\"continue\" \u003eContinue\u003c/button\u003e\n          \n        \u003c/div\u003e\n      \u003c/div\u003e\n    \u003c/form\u003e\n\n    \u003cp class=\"footnote\"\u003e\n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003crect x=\"4.5\" y=\"10.5\" width=\"15\" height=\"10\" rx=\"2\"/\u003e\u003cpath d=\"M8 10.5V7.5a4 4 0 0 1 8 0v3\"/\u003e\u003c/svg\u003e\n Keys are encrypted at rest. Your data is never stored in our database — only counts and ID pairs.\u003c/p\u003e\n  \u003c/main\u003e","scripts":["\n    (function () {\n      var form = document.getElementById(\"wizard\");\n      var step = Number(form.dataset.step);\n      var id = form.dataset.id;\n      var base = \"/migrations/\" + id;\n\n      function values() {\n        var data = { step: step };\n        if (step === 1) {\n          var chosen = form.querySelector(\"input[name=platform]:checked\");\n          data.platform = chosen ? chosen.value : \"\";\n        }\n        if (step === 3) {\n          data.entities = Array.prototype.map.call(form.querySelectorAll(\"input[name=entities]:checked\"), function (box) { return box.value; });\n          var range = form.querySelector(\"input[name=orders_range]:checked\");\n          data.orders_range = range ? range.value : \"all\";\n          data.orders_from = (form.querySelector(\"[name=orders_from]\") || {}).value || \"\";\n          data.orders_to = (form.querySelector(\"[name=orders_to]\") || {}).value || \"\";\n        }\n        if (step === 4) {\n          data.order_status_map = {};\n          Array.prototype.forEach.call(form.elements, function (field) {\n            if (!field.name) return;\n            if (field.name.indexOf(\"map.\") === 0) {\n              var parts = field.name.split(\".\");\n              data.order_status_map[parts[1]] = data.order_status_map[parts[1]] || {};\n              data.order_status_map[parts[1]][parts[2]] = field.value;\n            } else if (field.type === \"checkbox\") {\n              data[field.name] = field.checked;\n            } else if (field.type === \"radio\") {\n              if (field.checked) data[field.name] = field.value;\n            }\n          });\n          // Unrendered sections keep their defaults on the server.\n          [\"publish_online_store\", \"send_invites\", \"keep_order_numbers\", \"silent_orders\"].forEach(function (name) {\n            if (!(name in data)) data[name] = {\"product_status\":\"same\",\"sku_exists\":\"skip\",\"publish_online_store\":true,\"extra_attributes\":\"skip\",\"email_exists\":\"skip\",\"send_invites\":false,\"keep_order_numbers\":false,\"silent_orders\":true,\"orders_range\":\"range\",\"orders_from\":\"2024-01-01\",\"orders_to\":null,\"page_status\":\"same\",\"order_status_map\":{\"completed\":{\"payment\":\"PAID\",\"fulfilment\":\"FULFILLED\"},\"processing\":{\"payment\":\"PAID\",\"fulfilment\":\"UNFULFILLED\"},\"on-hold\":{\"payment\":\"PENDING\",\"fulfilment\":\"UNFULFILLED\"},\"pending\":{\"payment\":\"PENDING\",\"fulfilment\":\"UNFULFILLED\"},\"refunded\":{\"payment\":\"REFUNDED\",\"fulfilment\":\"UNFULFILLED\"},\"cancelled\":{\"payment\":\"VOIDED\",\"fulfilment\":\"UNFULFILLED\"},\"failed\":{\"payment\":\"VOIDED\",\"fulfilment\":\"UNFULFILLED\"}},\"platform\":\"woocommerce\"}[name];\n          });\n        }\n        return data;\n      }\n\n      form.addEventListener(\"submit\", async function (event) {\n        event.preventDefault();\n        window.appClearError();\n        var button = document.getElementById(\"continue\");\n        if (!button || button.disabled) return;\n        try {\n          var result = await window.appPostJson(base + \"/wizard\", values(), button);\n nt-size:12.5px\"\u003eConnection result\u003c/div\u003e' +\n              '\u003cdiv class=\"scan__status scan__status--ok\"\u003e✓ Connected — ' + escape(result.version || \"\") + '\u003c/div\u003e' +\n              '\u003cdiv class=\"muted\" style=\"margin-top:6px;font-size:12.5px\"\u003eWe found in your store:\u003c/div\u003e' +\n              '\u003cul class=\"scan__list\"\u003e' + result.counts.map(function (row) {\n                return \"\u003cli\u003e\u003cspan\u003e\" + escape(row.label) + \"\u003c/span\u003e\u003cstrong\u003e\" + row.count.toLocaleString(\"en-US\") + \"\u003c/strong\u003e\u003c/li\u003e\";\n              }).join(\"\") + \"\u003c/ul\u003e\";\n            [\"consumer_key\", \"consumer_secret\", \"app_password\"].forEach(function (name) {\n              var field = form.querySelector(\"[name=\" + name + \"]\");\n              if (field) { field.value = \"\"; field.placeholder = name === \"consumer_key\" ? result.hint + \"  (saved)\" : \"(saved)\"; }\n            });\n            form.querySelector(\"[name=base_url]\").value = result.base_url;\n            document.getElementById(\"continue\").disabled = false;\n            window.appToast(\"Connected\");\n          } catch (error) {\n            scan.innerHTML = '\u003cdiv class=\"muted\" style=\"font-size:12.5px\"\u003eConnection result\u003c/div\u003e\u003cdiv class=\"scan__status scan__status--error\"\u003e✕ Could not connect\u003c/div\u003e\u003cp style=\"margin-top:8px\"\u003e' + escape(error.message) + \"\u003c/p\u003e\";\n            document.getElementById(\"continue\").disabled = true;\n          }\n        });\n      }\n\n      /* ---- step 3: orders pull in products + customers; the date range follows orders ---- */\n      if (step === 3) {\n        var boxes = function (key) { return form.querySelector(\"input[name=entities][value=\" + key + \"]\"); };\n        var range = document.getElementById(\"orders-range\");\n        form.addEventListener(\"change\", function (event) {\n [name=\" + name + \"]\");\n            if (field) body[name] = field.value.trim();\n          });\n          if (!body.base_url) {\n            window.appPageError(\"Enter your store's address first.\");\n            form.querySelector(\"[name=base_url]\").focus();\n            return;\n          }\n          scan.innerHTML = '\u003cdiv class=\"scan__placeholder\"\u003e\u003cdiv\u003e\u003cspan class=\"btn is-loading\" style=\"box-shadow:none;background:none;width:24px\"\u003e\u003c/span\u003e\u003cp\u003eConnecting and counting your data…\u003cbr\u003e\u003cspan style=\"font-size:12.5px\"\u003eThis can take a few seconds on slower hosting.\u003c/span\u003e\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e';\n          try {\n            var result = await window.appPostJson(base + \"/connect\", body, test);\n            scan.innerHTML =\n              '\u003cdiv class=\"muted\" style=\"font-size:12.5px\"\u003eConnection result\u003c/div\u003e' +\n              '\u003cdiv class=\"scan__status scan__status--ok\"\u003e✓ Connected — ' + escape(result.version || \"\") + '\u003c/div\u003e' +\n              '\u003cdiv class=\"muted\" style=\"margin-top:6px;font-size:12.5px\"\u003eWe found in your store:\u003c/div\u003e' +\n              '\u003cul class=\"scan__list\"\u003e' + result.counts.map(function (row) {\n                return \"\u003cli\u003e\u003cspan\u003e\" + escape(row.label) + \"\u003c/span\u003e\u003cstrong\u003e\" + row.count.toLocaleString(\"en-US\") + \"\u003c/strong\u003e\u003c/li\u003e\";\n              }).join(\"\") + \"\u003c/ul\u003e\";\n            [\"consumer_key\", \"consumer_secret\", \"app_password\"].forEach(function (name) {\n              var field = form.querySelector(\"[name=\" + name + \"]\");\n              if (field) { field.value = \"\"; field.placeholder = name === \"consumer_key\" ? result.hint + \"  (saved)\" : \"(saved)\"; }\n            });\n            form.querySelector(\"[name=base_url]\").value = result.base_url;\n            document.getElementById(\"continue\").disabled = false;\n            window.appToast(\"Connected\");\n          } catch (error) {\n            scan.innerHTML = '\u003cdiv class=\"muted\" style=\"font-size:12.5px\"\u003eConnection result\u003c/div\u003e\u003cdiv class=\"scan__status scan__status--error\"\u003e✕ Could not connect\u003c/div\u003e\u003cp style=\"margin-top:8px\"\u003e' + escape(error.message) + \"\u003c/p\u003e\";\n            document.getElementById(\"continue\").disabled = true;\n          }\n        });\n      }\n\n      /* ---- step 3: orders pull in products + customers; the date range follows orders ---- */\n      if (step === 3) {\n        var boxes = function (key) { return form.querySelector(\"input[name=entities][value=\" + key + \"]\"); };\n        var range = document.getElementById(\"orders-range\");\n        form.addEventListener(\"change\", function (event) {\n          var orders = boxes(\"orders\");\n          if (event.target === orders \u0026\u0026 orders.checked) {\n            [\"products\", \"customers\"].forEach(function (key) { var box = boxes(key); if (box \u0026\u0026 !box.disabled) box.checked = true; });\n          }\n          if (orders \u0026\u0026 orders.checked \u0026\u0026 [\"products\", \"customers\"].some(function (key) { var box = boxes(key); return box \u0026\u0026 event.target === box \u0026\u0026 !box.checked; })) {\n            orders.checked = false;\n            window.appToast(\"Orders need their products and customers, so Orders was unticked too.\");\n          }\n          if (range) range.hidden = !(orders \u0026\u0026 orders.checked);\n          if (event.target.name === \"orders_from\" || event.target.name === \"orders_to\") {\n            var r = form.querySelector(\"input[name=orders_range][value=range]\");\n            if (r) r.checked = true;\n          }\n        });\n      }\n    })();\n  "]},"wizard-3":{"title":"New migration","html":"\u003cmain class=\"page page--narrow\"\u003e\n    \u003cbutton class= ckbox\" name=\"entities\" value=\"collections\" checked \u003e\n                \u003cspan class=\"pick__text\"\u003e\n                  \u003cspan class=\"pick__name\"\u003eCategories\u003c/span\u003e\n                  \u003cspan class=\"pick__detail\"\u003e→ Collections\u003c/span\u003e\n                  \n                \u003c/span\u003e\n                \u003cspan class=\"pick__count\"\u003e36\u003c/span\u003e\n              \u003c/label\u003e\n            \n              \u003clabel class=\"pick__item\"\u003e\n                \u003cinput type=\"checkbox\" name=\"entities\" value=\"products\" checked \u003e\n                \u003cspan class=\"pick__text\"\u003e\n                  \u003cspan class=\"pick__name\"\u003eProducts\u003c/span\u003e\n                  \u003cspan class=\"pick__detail\"\u003evariants, images, stock\u003c/span\u003e\n                  \n                \u003c/span\u003e\n                \u003cspan class=\"pick__count\"\u003e1,240\u003c/span\u003e\n              \u003c/label\u003e\n            \n              \u003clabel class=\"pick__item\"\u003e\n                \u003cinput type=\"checkbox\" name=\"entities\" value=\"customers\" checked \u003e\n                \u003cspan class=\"pick__text\"\u003e\n                  \u003cspan class=\"pick__name\"\u003eCustomers\u003c/span\u003e\n                  \u003cspan class=\"pick__detail\"\u003e\u003c/span\u003e\n                  \n                \u003c/span\u003e\n                \u003cspan class=\"pick__count\"\u003e800\u003c/span\u003e\n              \u003c/label\u003e\n            \n              \u003clabel class=\"pick__item\"\u003e\n                \u003cinput type=\"checkbox\" name=\"entities\" value=\"orders\" checked \u003e\n                \u003cspan class=\"pick__text\"\u003e\n                  \u003cspan class=\"pick__name\"\u003eOrders\u003c/span\u003e\n                  \u003cspan class=\"pick__detail\"\u003eneeds Products + Customers\u003c/span\u003e\n                  \n                \u003c/span\u003e\n                \u003cspan class=\"pick__count\"\u003e3,100\u003c/span\u003e\n              \u003c/label\u003e\n            \n              \u003clabel class=\"pick__item\"\u003e\n                \u003cinput type=\"checkbox\" name=\"entities\" value=\"coupons\"  \u003e\n                \u003cspan class=\"pick__text\"\u003e\n                  \u003cspan class=\"pick__name\"\u003eCoupons\u003c/span\u003e\n                  \u003cspan class=\"pick__detail\"\u003e→ Discount codes\u003c/span\u003e\n                  \n                \u003c/span\u003e\n                \u003cspan class=\"pick__count\"\u003e12\u003c/span\u003e\n              \u003c/label\u003e\n            \n              \u003clabel class=\"pick__item\"\u003e\n                \u003cinput type=\"checkbox\" name=\"entities\" value=\"pages\"  \u003e\n                \u003cspan class=\"pick__text\"\u003e\n                  \u003cspan class=\"pick__name\"\u003ePages\u003c/span\u003e\n                  \u003cspan class=\"pick__detail\"\u003e\u003c/span\u003e\n                  \n                \u003c/span\u003e\n                \u003cspan class=\"pick__count\"\u003e8\u003c/span\u003e\n              \u003c/label\u003e\n            \n              \u003clabel class=\"pick__item\"\u003e\n                \u003cinput type=\"checkbox\" name=\"entities\" value=\"posts\"  \u003e\n                \u003cspan class=\"pick__text\"\u003e\n                  \u003cspan class=\"pick__name\"\u003eBlog posts\u003c/span\u003e\n                  \u003cspan class=\"pick__detail\"\u003e\u003c/span\u003e\n                  \n                \u003c/span\u003e\n                \u003cspan class=\"pick__count\"\u003e32\u003c/span\u003e\n              \u003c/label\u003e\n            \n              \u003clabel class=\"pick__item\"\u003e\n                \u003cinput type=\"checkbox\" name=\"entities\" value=\"redirects\" checked \u003e\n                \u003cspan class=\"pick__text\"\u003e\n                  \u003cspan class=\"pick__name\"\u003e301 Redirects\u003c/span\u003e\n                  \u003cspan class=\"pick__detail\"\u003ekeep Google rankings\u003c/span\u003e\n                  \n                \u003c/span\u003e\n                \u003cspan class=\"pick__count\"\u003eauto\u003c/span\u003e\n              \u003c/label\u003e\n            \n          \u003c/div\u003e\n        \u003c/div\u003e\n        \n          \u003cdiv class=\"card__section\" id=\"orders-range\"\u003e\n            \u003cfieldset class=\"fieldset\"\u003e\n              \u003clegend class=\"fieldset__legend\"\u003eOrders date range\u003c/legend\u003e\n              \u003cdiv class=\"radio-row\"\u003e\n                \u003clabel class=\"check\"\u003e\u003cinput type=\"radio\" name=\"orders_range\" value=\"all\"\u003e\u003cspan\u003eAll orders\u003c/span\u003e\u003c/label\u003e\n                \u003clabel class=\"check\"\u003e\u003cinput type=\"radio\" name=\"orders_range\" value=\"range\" checked\u003e\u003cspan\u003eFrom\u003c/span\u003e\u003c/label\u003e\n                \u003cinput class=\"input input--sm\" type=\"date\" name=\"orders_from\" aria-label=\"From date\" value=\"2024-01-01\"\u003e\n                \u003cspan class=\"muted\"\u003eto\u003c/span\u003e\n                \u003cinput class=\"input input--sm\" type=\"date\" name=\"orders_to\" aria-label=\"To date\" value=\"\"\u003e\n                \u003cspan class=\"muted\" style=\"font-size:12.5px\"\u003e(empty = today)\u003c/span\u003e\n              \u003c/div\u003e\n            \u003c/fieldset\u003e\n          \u003c/div\u003e\n        \n\n      \n\n      \u003cdiv class=\"wizard-footer\"\u003e\n        \u003cbutton class=\"btn btn--plain btn--critical-plain\" type=\"button\" style=\"color:var(--critical)\"\n          data-post=\"/migrations/13/discard\" data-then=\"/migrations\"\n          data-confirm=\"Discard this draft?\\n\\nNothing has been migrated yet, so nothing is lost.\" data-confirm-label=\"Discard\" data-destructive\u003e\n          Discard\n        \u003c/button\u003e\n        \u003cdiv class=\"wizard-footer__actions\"\u003e\n          \n            \u003cbutton class=\"btn\" type=\"button\" data-navigate=\"/migrations/13?step=2\"\u003eBack\u003c/button\u003e\n          \n          \n            \u003cbutton class=\"btn btn--primary\" type=\"submit\" id=\"continue\" \u003eContinue\u003c/button\u003e\n          \n        \u003c/div\u003e\n      \u003c/div\u003e\n    \u003c/form\u003e\n\n    \u003cp class=\"footnote\"\u003e\n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003crect x=\"4.5\" y=\"10.5\" width=\"15\" height=\"10\" rx=\"2\"/\u003e\u003cpath d=\"M8 10.5V7.5a4 4 0 0 1 8 0v3\"/\u003e\u003c/svg\u003e\n Keys are encrypted at rest. Your data is never stored in our database — only counts and ID pairs.\u003c/p\u003e\n  \u003c/main\u003e","scripts":["\n    (function () {\n      var form = document.getElementById(\"wizard\");\n      var step = Number(form.dataset.step);\n      var id = form.dataset.id;\n      var base = \"/migrations/\" + id;\n\n      function values() {\n        var data = { step: step };\n        if (step === 1) {\n          var chosen = form.querySelector(\"input[name=platform]:checked\");\n          data.platform = chosen ? chosen.value : \"\";\n        }\n        if (step === 3) {\n          data.entities = Array.prototype.map.call(form.querySelectorAll(\"input[name=entities]:checked\"), function (box) { return box.value; });\n          var range = form.querySelector(\"input[name=orders_range]:checked\");\n          data.orders_range = range ? range.value : \"all\";\n          data.orders_from = (form.querySelector(\"[name=orders_from]\") || {}).value || \"\";\n          data.orders_to = (form.querySelector(\"[name=orders_to]\") || {}).value || \"\";\n        }\n        if (step === 4) {\n          data.order_status_map = {};\n          Array.prototype.forEach.call(form.elements, function (field) {\n            if (!field.name) return;\n            if (field.name.indexOf(\"map.\") === 0) {\n              var parts = field.name.split(\".\");\n              data.order_status_map[parts[1]] = data.order_status_map[parts[1]] || {};\n              data.order_status_map[parts[1]][parts[2]] = field.value;\n            } else if (field.type === \"checkbox\") {\n              data[field.name] = field.checked;\n            } else if (field.type === \"radio\") {\n              if (field.checked) data[field.name] = field.value;\n            }\n          });\n          // Unrendered sections keep their defaults on the server.\n          [\"publish_online_store\", \"send_invites\", \"keep_order_numbers\", \"silent_orders\"].forEach(function (name) {\n            if (!(name in data)) data[name] = {\"product_status\":\"same\",\"sku_exists\":\"skip\",\"publish_online_store\":true,\"extra_attributes\":\"skip\",\"email_exists\":\"skip\",\"send_invites\":false,\"keep_order_numbers\":false,\"silent_orders\":true,\"orders_range\":\"range\",\"orders_from\":\"2024-01-01\",\"orders_to\":null,\"page_status\":\"same\",\"order_status_map\":{\"completed\":{\"payment\":\"PAID\",\"fulfilment\":\"FULFILLED\"},\"processing\":{\"payment\":\"PAID\",\"fulfilment\":\"UNFULFILLED\"},\"on-hold\":{\"payment\":\"PENDING\",\"fulfilment\":\"UNFULFILLED\"},\"pending\":{\"payment\":\"PENDING\",\"fulfilment\":\"UNFULFILLED\"},\"refunded\":{\"payment\":\"REFUNDED\",\"fulfilment\":\"UNFULFILLED\"},\"cancelled\":{\"payment\":\"VOIDED\",\"fulfilment\":\"UNFULFILLED\"},\"failed\":{\"payment\":\"VOIDED\",\"fulfilment\":\"UNFULFILLED\"}},\"platform\":\"woocommerce\"}[name];\n          });\n        }\n        return data;\n      }\n\n      form.addEventListener(\"submit\", async function (event) {\n        event.preventDefault();\n        window.appClearError();\n        var button = document.getElementById(\"continue\");\n        if (!button || button.disabled) return;\n        try {\n          var result = await window.appPostJson(base + \"/wizard\", values(), button);\n          window.appNavigate(base + \"?step=\" + result.next);\n        } catch (error) {\n          window.appPageError(error.message);\n        }\n      });\n\n      /* ---- step 1: choosing a tile enables Continue ---- */\n      if (step === 1) {\n        var cont = document.getElementById(\"continue\");\n        var update = function () { cont.disabled = !form.querySelector(\"input[name=platform]:checked\"); };\n        form.addEventListener(\"change\", update);\n        update();\n      }\n\n      /* ---- step 2: test connection ---- */\n      var test = document.getElementById(\"test-connection\");\n      if (test) {\n        var scan = document.getElementById(\"scan\");\n        var escape = function (text) { var div = document.createElement(\"div\"); div.textContent = text; return div.innerHTML; };\n\n        test.addEventListener(\"click\", async function () {\n          window.appClearError();\n          var body = {};\n          [\"base_url\", \"consumer_key\", \"consumer_secret\", \"username\", \"app_password\"].forEach(function (name) {\n            var field = form.querySelector(\"[name=\" + name + \"]\");\n            if (field) body[name] = field.value.trim();\n          });\n          if (!body.base_url) {\n            window.appPageError(\"Enter your store's address first.\");\n            form.querySelector(\"[name=base_url]\").focus();\n            return;\n          }\n          scan.innerHTML = '\u003cdiv class=\"scan__placeholder\"\u003e\u003cdiv\u003e\u003cspan class=\"btn is-loading\" style=\"box-shadow:none;background:none;width:24px\"\u003e\u003c/span\u003e\u003cp\u003eConnecting and counting your data…\u003cbr\u003e\u003cspan style=\"font-size:12.5px\"\u003eThis can take a few seconds on slower hosting.\u003c/span\u003e\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e';\n
