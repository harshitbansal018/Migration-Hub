ssible for this migration.\"\n                data-confirm-label=\"Delete files\" data-destructive data-toast=\"Files deleted\"\u003e\n                Delete migration data now\n              \u003c/button\u003e\n            \n          \u003c/div\u003e\n        \u003c/div\u003e\n      \u003c/section\u003e\n    \u003c/div\u003e\n  \u003c/main\u003e","scripts":["\n    (function () {\n      var id = 10;\n\n      var download = document.getElementById(\"download-csv\");\n      if (download) {\n        download.addEventListener(\"click\", async function () {\n          try {\n            var response = await window.appFetch(\"/migrations/\" + id + \"/errors.csv\", { busy: download });\n            if (!response.ok) throw new Error(\"The error report could not be downloaded.\");\n            var url = URL.createObjectURL(await response.blob());\n            var link = document.createElement(\"a\");\n            link.href = url;\n            link.download = \"migration-\" + id + \"-errors.csv\";\n            document.body.appendChild(link);\n            link.click();\n            link.remove();\n            setTimeout(function () { URL.revokeObjectURL(url); }, 2000);\n          } catch (error) {\n            window.appPageError(error.message);\n          }\n        });\n      }\n\n      \n    })();\n  "]},"plans":{"title":"Plans","html":"\u003cmain class=\"page\"\u003e\n    \u003cheader class=\"page-header\"\u003e\n      \u003cdiv\u003e\n        \u003ch1 class=\"page-header__title\"\u003ePlans\u003c/h1\u003e\n        \u003cp class=\"page-header__sub\"\u003e\n          \n            You are on the \u003cstrong\u003ePro\u003c/strong\u003e plan.\n          \n          The free demo is always included and never counts against your plan.\n        \u003c/p\u003e\n      \u003c/div\u003e\n    \u003c/header\u003e\n\n    \u003cdiv class=\"stack\"\u003e\n      \n\n      \n\n      \n\u003cdiv class=\"banner banner--critical\" id=\"page-error\" role=\"alert\" hidden\u003e\n  \n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"M12 3.5 2.5 20h19L12 3.5z\"/\u003e\u003cpath d=\"M12 10v4.5\"/\u003e\u003cpath d=\"M12 17.5v.01\"/\u003e\u003c/svg\u003e\n\n  \u003cdiv class=\"banner__body\" data-error-text\u003e\u003c/div\u003e\n\u003c/div\u003e\n\n\n      \u003csection class=\"plans\" aria-label=\"Plans\"\u003e\n        \n          \u003carticle class=\"plan\"\u003e\n            \u003cdiv class=\"plan__head\"\u003e\n              \u003ch2 class=\"plan__name\"\u003eFree\u003c/h2\u003e\n              \n            \u003c/div\u003e\n\n            \u003cp class=\"plan__price\"\u003e\n              Free\n            \u003c/p\u003e\n\n            \u003cul class=\"plan__features\"\u003e\n              \n                \u003cli\u003e\n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"m5 12.5 4.5 4.5L19 7.5\"/\u003e\u003c/svg\u003e\n\u003cspan\u003eFree demo — 20 of each data type\u003c/span\u003e\u003c/li\u003e\n              \n                \u003cli\u003e\n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"m5 12.5 4.5 4.5L19 7.5\"/\u003e\u003c/svg\u003e\n\u003cspan\u003eCheck results in Shopify first\u003c/span\u003e\u003c/li\u003e\n              \n                \u003cli\u003e\n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"m5 12.5 4.5 4.5L19 7.5\"/\u003e\u003c/svg\u003e\n\u003cspan\u003eCommunity support\u003c/span\u003e\u003c/li\u003e\n              \n            \u003c/ul\u003e\n\n            \n              \u003cbutton\n                class=\"btn btn--full plan__select\"\n                type=\"button\"\n                data-plan=\"1\"\n                data-name=\"Free\"\n                data-direction=\"downgrade\"\u003e\n                Downgrade\n              \u003c/button\u003e\n            \n          \u003c/article\u003e\n        \n          \u003carticle class=\"plan\"\u003e\n            \u003cdiv class=\"plan__head\"\u003e\n              \u003ch2 class=\"plan__name\"\u003eStarter\u003c/h2\u003e\n              \n            \u003c/div\u003e\n\n            \u003cp class=\"plan__price\"\u003e\n              $19 \u003csmall\u003e/mo\u003c/small\u003e\n            \u003c/p\u003e\n\n            \u003cul class=\"plan__features\"\u003e\n              \n                \u003cli\u003e\n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"m5 12.5 4.5 4.5L19 7.5\"/\u003e\u003c/svg\u003e\n\u003cspan\u003e2,000 records / month\u003c/span\u003e\u003c/li\u003e\n              \n                \u003cli\u003e\n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"m5 12.5 4.5 4.5L19 7.5\"/\u003e\u003c/svg\u003e\n\u003cspan\u003eProducts, collections, customers\u003c/span\u003e\u003c/li\u003e\n              \n                \u003cli\u003e\n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"m5 12.5 4.5 4.5L19 7.5\"/\u003e\u003c/svg\u003e\n\u003cspan\u003e301 redirects\u003c/span\u003e\u003c/li\u003e\n              \n                \u003cli\u003e\n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"m5 12.5 4.5 4.5L19 7.5\"/\u003e\u003c/svg\u003e\n\u003cspan\u003eEmail support\u003c/span\u003e\u003c/li\u003e\n              \n            \u003c/ul\u003e\n\n            \n              \u003cbutton\n                class=\"btn btn--full plan__select\"\n                type=\"button\"\n                data-plan=\"2\"\n                data-name=\"Starter\"\n                data-direction=\"downgrade\"\u003e\n                Downgrade\n              \u003c/button\u003e\n            \n          \u003c/article\u003e\n        \n          \u003carticle class=\"plan plan--current\"\u003e\n            \u003cdiv class=\"plan__head\"\u003e\n              \u003ch2 class=\"plan__name\"\u003ePro\u003c/h2\u003e\n              \u003cspan class=\"badge badge--info\"\u003ePopular\u003c/span\u003e\n            \u003c/div\u003e\n\n            \u003cp class=\"plan__price\"\u003e\n              $49 \u003csmall\u003e/mo\u003c/small\u003e\n            \u003c/p\u003e\n\n            \u003cul class=\"plan__features\"\u003e\n              \n                \u003cli\u003e\n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"m5 12.5 4.5 4.5L19 7.5\"/\u003e\u003c/svg\u003e\n\u003cspan\u003e25,000 records / month\u003c/span\u003e\u003c/li\u003e\n              \n                \u003cli\u003e\n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"m5 12.5 4.5 4.5L19 7.5\"/\u003e\u003c/svg\u003e\n\u003cspan\u003eAll data — orders, coupons, blog\u003c/span\u003e\u003c/li\u003e\n              \n                \u003cli\u003e\n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"m5 12.5 4.5 4.5L19 7.5\"/\u003e\u003c/svg\u003e\n\u003cspan\u003e301 redirects\u003c/span\u003e\u003c/li\u003e\n              \n                \u003cli\u003e\n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"m5 12.5 4.5 4.5L19 7.5\"/\u003e\u003c/svg\u003e\n\u003cspan\u003eMigrate recent data\u003c/span\u003e\u003c/li\u003e\n              \n            \u003c/ul\u003e\n\n            \n              \u003cspan class=\"plan__current\"\u003e\n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/\u003e\u003cpath d=\"m8.5 12 2.5 2.5 4.5-5\"/\u003e\u003c/svg\u003e\n Current plan\u003c/span\u003e\n            \n          \u003c/article\u003e\n        \n          \u003carticle class=\"plan\"\u003e\n            \u003cdiv class=\"plan__head\"\u003e\n              \u003ch2 class=\"plan__name\"\u003eUnlimited\u003c/h2\u003e\n              \n            \u003c/div\u003e\n\n            \u003cp class=\"plan__price\"\u003e\n              $99 \u003csmall\u003e/mo\u003c/small\u003e\n            \u003c/p\u003e\n\n            \u003cul class=\"plan__features\"\u003e\n              \n                \u003cli\u003e\n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"m5 12.5 4.5 4.5L19 7.5\"/\u003e\u003c/svg\u003e\n\u003cspan\u003eUnlimited records\u003c/span\u003e\u003c/li\u003e\n              \n                \u003cli\u003e\n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"m5 12.5 4.5 4.5L19 7.5\"/\u003e\u003c/svg\u003e\n\u003cspan\u003eAll data, redirects, recent data\u003c/span\u003e\u003c/li\u003e\n              \n                \u003cli\u003e\n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"m5 12.5 4.5 4.5L19 7.5\"/\u003e\u003c/svg\u003e\n\u003cspan\u003eMigration assistance\u003c/span\u003e\u003c/li\u003e\n              \n            \u003c/ul\u003e\n\n            \n              \u003cbutton\n                class=\"btn btn--full btn--primary plan__select\"\n                type=\"button\"\n                data-plan=\"4\"\n                data-name=\"Unlimited\"\n                data-direction=\"upgrade\"\u003e\n                Upgrade\n              \u003c/button\u003e\n            \n          \u003c/article\u003e\n        \n      \u003c/section\u003e\n\n      \u003cp class=\"footnote\"\u003e\n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"M3 7.5A2 2 0 0 1 5 5.5h11a2 2 0 0 1 2 2v1\"/\u003e\u003cpath d=\"M3 7.5v9a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2v-2\"/\u003e\u003cpath d=\"M20 10.5h-3.5a2 2 0 0 0 0 4H20a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1z\"/\u003e\u003c/svg\u003e\n Billed through Shopify every 30 days. Records reset on the 1st of each month. Change or cancel any time.\u003c/p\u003e\n    \u003c/div\u003e\n  \u003c/main\u003e","scripts":["\n    (function () {\n      Array.prototype.slice.call(document.querySelectorAll(\".plan__select\")).forEach(function (button) {\n        button.addEventListener(\"click\", async function () {\n          window.appClearError();\n\n          if (button.dataset.direction === \"downgrade\" \u0026\u0026 !(await window.appConfirm(\n            \"Downgrade to \" + button.dataset.name + \"?\\n\\nYour record limit changes straight away. Migrations already finished are not affected.\",\n            { confirmLabel: \"Downgrade\" }\n          ))) return;\n\n          try {\n            var data = await window.appPostJson(\"/plans/select\", { plan_id: Number(button.dataset.plan) }, button);\n            // A paid plan is approved in Shopify first, at the top level:\n            // the approval page refuses to be framed.\n            if (data.confirmation_url) {\n              window.top.location.href = data.confirmation_url;\n              return;\n            }\n            window.appToast(\"Plan updated\");\n            window.appNavigate(\"/plans\");\n          } catch (error) {\n            window.appPageError(error.message);\n          }\n        });\n      });\n    })();\n  "]},"help-install":{"title":"Help \u0026 support","html":"\u003cmain class=\"page page--narrow\"\u003e\n    \u003cheader class=\"page-header\"\u003e\n      \u003cdiv\u003e\n        \u003ch1 class=\"page-header__title\"\u003eHelp \u0026amp; support\u003c/h1\u003e\n        \u003cp class=\"page-header__sub\"\u003eHow to set up, how to create API keys, and answers to common questions.\u003c/p\u003e\n      \u003c/div\u003e\n      \n        \u003cdiv class=\"page-header__actions\"\u003e\n          \u003ca class=\"btn\" href=\"mailto:support@example.com\" target=\"_top\"\u003e\n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/\u003e\u003cpath d=\"M9.5 9.5a2.5 2.5 0 0 1 4.9.6c0 1.7-2.4 2.2-2.4 3.9\"/\u003e\u003cpath d=\"M12 17v.01\"/\u003e\u003c/svg\u003e\n Contact support\u003c/a\u003e\n        \u003c/div\u003e\n      \n    \u003c/header\u003e\n\n    \n    \u003cnav class=\"tabs tabs--standalone\" aria-label=\"Help sections\"\u003e\n      \n        \u003cbutton class=\"tabs__tab tabs__tab--on\" type=\"button\" data-navigate=\"/help?tab=install\" aria-current=page\u003eInstallation steps\u003c/button\u003e\n      \n        \u003cbutton class=\"tabs__tab\" type=\"button\" data-navigate=\"/help?tab=keys\" \u003eAPI keys\u003c/button\u003e\n      \n        \u003cbutton class=\"tabs__tab\" type=\"button\" data-navigate=\"/help?tab=faq\" \u003eFAQ\u003c/button\u003e\n      \n    \u003c/nav\u003e\n\n    \n\n      \u003csection class=\"card\"\u003e\n        \u003col class=\"howto\"\u003e\n          \n            \u003cli class=\"howto__item\"\u003e\n              \u003cspan class=\"howto__num\"\u003e1\u003c/span\u003e\n              \u003cdiv\u003e\n                \u003cdiv class=\"howto__title\"\u003eAdd the app from the Shopify App Store\u003c/div\u003e\n                \u003cdiv class=\"howto__detail\"\u003eApprove the permissions Shopify lists. Nothing in your new store changes at this point.\u003c/div\u003e\n                \n              \u003c/div\u003e\n            \u003c/li\u003e\n          \n            \u003cli class=\"howto__item\"\u003e\n              \u003cspan class=\"howto__num\"\u003e2\u003c/span\u003e\n              \u003cdiv\u003e\n                \u003cdiv class=\"howto__title\"\u003eCreate read-only API keys in your old store\u003c/div\u003e\n                \u003cdiv class=\"howto__detail\"\u003eWooCommerce: a REST API key with Read permission. See the API keys tab for each step.\u003c/div\u003e\n                \n                  \u003cdiv class=\"path\"\u003e\n                    \u003cspan\u003eWooCommerce\u003c/span\u003e\n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"12\" height=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"m9 6 6 6-6 6\"/\u003e\u003c/svg\u003e\n\u003cspan\u003eSettings\u003c/span\u003e\n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"12\" height=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"m9 6 6 6-6 6\"/\u003e\u003c/svg\u003e\n\u003cspan\u003eAdvanced\u003c/span\u003e\n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"12\" height=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"m9 6 6 6-6 6\"/\u003e\u003c/svg\u003e\n\u003cspan\u003eREST API\u003c/span\u003e\n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"12\" height=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"m9 6 6 6-6 6\"/\u003e\u003c/svg\u003e\n\u003cspan\u003eAdd key\u003c/span\u003e\n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"12\" height=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"m9 6 6 6-6 6\"/\u003e\u003c/svg\u003e\n\u003cspan\u003ePermissions: Read\u003c/span\u003e\n                  \u003c/div\u003e\n                \n              \u003c/div\u003e\n            \u003c/li\u003e\n          \n            \u003cli class=\"howto__item\"\u003e\n              \u003cspan class=\"howto__num\"\u003e3\u003c/span\u003e\n              \u003cdiv\u003e\n                \u003cdiv class=\"howto__title\"\u003eConnect and run a free demo\u003c/div\u003e\n                \u003cdiv class=\"howto__detail\"\u003eThe demo moves 20 of each kind of data. Check them in your Shopify admin before the full migration — and delete them with one click if you want to start clean.\u003c/div\u003e\n                \n              \u003c/div\u003e\n            \u003c/li\u003e\n          \n            \u003cli class=\"howto__item\"\u003e\n              \u003cspan class=\"howto__num\"\u003e4\u003c/span\u003e\n              \u003cdiv\u003e\n                \u003cdiv class=\"howto__title\"\u003eBegin the full migration\u003c/div\u003e\n                \u003cdiv class=\"howto__detail\"\u003eIt runs on our server, so you can close the browser. Then review the results and retry anything that failed.\u003c/div\u003e\n                \n              \u003c/div\u003e\n            \u003c/li\u003e\n          \n        \u003c/ol\u003e\n      \u003c/section\u003e\n\n      \u003csection class=\"card\" style=\"margin-top:16px\"\u003e\n        \u003cdiv class=\"card__header\"\u003e\u003ch2 class=\"card__title\"\u003eHow your data moves\u003c/h2\u003e\u003c/div\u003e\n        \u003cdiv class=\"card__section\"\u003e\n          \u003cdiv class=\"flow\"\u003e\n            \u003cspan class=\"flow__node\"\u003e\n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"M4 9.5 5.5 4h13L20 9.5\"/\u003e\u003cpath d=\"M4 9.5a2.7 2.7 0 0 0 5.3 0 2.7 2.7 0 0 0 5.4 0 2.7 2.7 0 0 0 5.3 0\"/\u003e\u003cpath d=\"M5.5 11.5V20h13v-8.5\"/\u003e\u003cpath d=\"M10 20v-5h4v5\"/\u003e\u003c/svg\u003e\n Old store \u003cspan class=\"badge\"\u003eread only\u003c/span\u003e\u003c/span\u003e\n            \u003cspan class=\"flow__arrow\"\u003e\n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"M5 12h14\"/\u003e\u003cpath d=\"m13 6 6 6-6 6\"/\u003e\u003c/svg\u003e\n\u003c/span\u003e\n            \u003cspan class=\"flow__node\"\u003e\n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003crect x=\"4.5\" y=\"10.5\" width=\"15\" height=\"10\" rx=\"2\"/\u003e\u003cpath d=\"M8 10.5V7.5a4 4 0 0 1 8 0v3\"/\u003e\u003c/svg\u003e\n Encrypted files \u003cspan class=\"badge\"\u003e30 / 90 days\u003c/span\u003e\u003c/span\u003e\n            \u003cspan class=\"flow__arrow\"\u003e\n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"M5 12h14\"/\u003e\u003cpath d=\"m13 6 6 6-6 6\"/\u003e\u003c/svg\u003e\n\u003c/span\u003e\n            \u003cspan class=\"flow__node\"\u003e\n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/\u003e\u003cpath d=\"m8.5 12 2.5 2.5 4.5-5\"/\u003e\u003c/svg\u003e\n Shopify \u003cspan class=\"badge badge--success\"\u003epermanent\u003c/span\u003e\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cp class=\"muted\" style=\"margin-top:12px\"\u003e\n            Data moves in a fixed order — collections, products, customers, orders, coupons, pages \u0026amp; posts, then redirects — so every order is linked to the right products and customer. Our database keeps only status, counters and old-ID ↔ Shopify-ID pairs; never names, emails or addresses.\n          \u003c/p\u003e\n        \u003c/div\u003e\n      \u003c/section\u003e\n\n    \n  \u003c/main\u003e","scripts":[]},"help-keys":{"title":"Help \u0026 support","html":"\u003cmain class=\"page page--narrow\"\u003e\n    \u003cheader class=\"page-header\"\u003e\n      \u003cdiv\u003e\n        \u003ch1 class=\"page-header__title\"\u003eHelp \u0026amp; support\u003c/h1\u003e\n        \u003cp class=\"page-header__sub\"\u003eHow to set up, how to create API keys, and answers to common questions.\u003c/p\u003e\n      \u003c/div\u003e\n      \n        \u003cdiv class=\"page-header__actions\"\u003e\n          \u003ca class=\"btn\" href=\"mailto:support@example.com\" target=\"_top\"\u003e\n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/\u003e\u003cpath d=\"M9.5 9.5a2.5 2.5 0 0 1 4.9.6c0 1.7-2.4 2.2-2.4 3.9\"/\u003e\u003cpath d=\"M12 17v.01\"/\u003e\u003c/svg\u003e\n Contact support\u003c/a\u003e\n        \u003c/div\u003e\n      \n    \u003c/header\u003e\n\n    \n    \u003cnav class=\"tabs tabs--standalone\" aria-label=\"Help sections\"\u003e\n      \n        \u003cbutton class=\"tabs__tab\" type=\"button\" data-navigate=\"/help?tab=install\" \u003eInstallation steps\u003c/button\u003e\n      \n        \u003cbutton class=\"tabs__tab tabs__tab--on\" type=\"button\" data-navigate=\"/help?tab=keys\" aria-current=page\u003eAPI keys\u003c/button\u003e\n      \n        \u003cbutton class=\"tabs__tab\" type=\"button\" data-navigate=\"/help?tab=faq\" \u003eFAQ\u003c/button\u003e\n      \n    \u003c/nav\u003e\n\n    \n\n      \u003cdiv class=\"stack\"\u003e\n        \n          \u003csection class=\"card\"\u003e\n            \u003cdiv class=\"card__header\"\u003e\n              \u003cdiv class=\"row\"\u003e\n                \u003cspan class=\"tile__logo tile__logo--woocommerce\" style=\"width:32px;height:32px;font-size:12px;border-radius:9px\"\u003eWo\u003c/span\u003e\n                \u003ch2 class=\"card__title\"\u003eWooCommerce\u003c/h2\u003e\n              \u003c/div\u003e\n            \u003c/div\u003e\n            \u003col class=\"howto\"\u003e\n              \n                \u003cli class=\"howto__item\"\u003e\u003cspan class=\"howto__num\"\u003e1\u003c/span\u003e\u003cdiv class=\"howto__detail\" style=\"margin:3px 0 0;color:var(--text)\"\u003eIn your WordPress admin, open WooCommerce → Settings → Advanced → REST API.\u003c/div\u003e\u003c/li\u003e\n              \n                \u003cli class=\"howto__item\"\u003e\u003cspan class=\"howto__num\"\u003e2\u003c/span\u003e\u003cdiv class=\"howto__detail\" style=\"margin:3px 0 0;color:var(--text)\"\u003ePress Add key. Description: “Shopify migration”. User: an administrator.\u003c/div\u003e\u003c/li\u003e\n              \n                \u003cli class=\"howto__item\"\u003e\u003cspan class=\"howto__num\"\u003e3\u003c/span\u003e\u003cdiv class=\"howto__detail\" style=\"margin:3px 0 0;color:var(--text)\"\u003eSet Permissions to Read — we never need to write to your old store.\u003c/div\u003e\u003c/li\u003e\n              \n                \u003cli class=\"howto__item\"\u003e\u003cspan class=\"howto__num\"\u003e4\u003c/span\u003e\u003cdiv class=\"howto__detail\" style=\"margin:3px 0 0;color:var(--text)\"\u003ePress Generate API key, then copy the Consumer key (ck_…) and Consumer secret (cs_…).\u003c/div\u003e\u003c/li\u003e\n              \n                \u003cli class=\"howto__item\"\u003e\u003cspan class=\"howto__num\"\u003e5\u003c/span\u003e\u003cdiv class=\"howto__detail\" style=\"margin:3px 0 0;color:var(--text)\"\u003ePaste both into the Connect step of a new migration. The secret is shown only once by WooCommerce, so copy it now.\u003c/div\u003e\u003c/li\u003e\n              \n            \u003c/ol\u003e\n            \u003cdiv class=\"card__section card__section--subdued\"\u003e\n              \u003cdiv class=\"row\" style=\"flex-wrap:nowrap;align-items:flex-start\"\u003e\u003cspan class=\"muted\"\u003e\n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/\u003e\u003cpath d=\"M12 11v5.5\"/\u003e\u003cpath d=\"M12 7.5v.01\"/\u003e\u003c/svg\u003e\n\u003c/span\u003e\u003cspan class=\"muted\"\u003eYour store must use https://. If “REST API” returns 404, set Settings → Permalinks to anything except “Plain”.\u003c/span\u003e\u003c/div\u003e\n            \u003c/div\u003e\n          \u003c/section\u003e\n        \n          \u003csection class=\"card\"\u003e\n            \u003cdiv class=\"card__header\"\u003e\n              \u003cdiv class=\"row\"\u003e\n                \u003cspan class=\"tile__logo tile__logo--wordpress\" style=\"width:32px;height:32px;font-size:12px;border-radius:9px\"\u003eWo\u003c/span\u003e\n                \u003ch2 class=\"card__title\"\u003eWordPress\u003c/h2\u003e\n              \u003c/div\u003e\n            \u003c/div\u003e\n            \u003col class=\"howto\"\u003e\n              \n                \u003cli class=\"howto__item\"\u003e\u003cspan class=\"howto__num\"\u003e1\u003c/span\u003e\u003cdiv class=\"howto__detail\" style=\"margin:3px 0 0;color:var(--text)\"\u003ePublished pages and posts are public, so for those no keys are needed — leave the fields empty.\u003c/div\u003e\u003c/li\u003e\n              \n                \u003cli class=\"howto__item\"\u003e\u003cspan class=\"howto__num\"\u003e2\u003c/span\u003e\u003cdiv class=\"howto__detail\" style=\"margin:3px 0 0;color:var(--text)\"\u003eTo include drafts too: Users → Profile → Application Passwords.\u003c/div\u003e\u003c/li\u003e\n              \n                \u003cli class=\"howto__item\"\u003e\u003cspan class=\"howto__num\"\u003e3\u003c/span\u003e\u003cdiv class=\"howto__detail\" style=\"margin:3px 0 0;color:var(--text)\"\u003eName it “Shopify migration” and press Add New Application Password.\u003c/div\u003e\u003c/li\u003e\n              \n                \u003cli class=\"howto__item\"\u003e\u003cspan class=\"howto__num\"\u003e4\u003c/span\u003e\u003cdiv class=\"howto__detail\" style=\"margin:3px 0 0;color:var(--text)\"\u003eEnter your WordPress username and the generated password in the Connect step.\u003c/div\u003e\u003c/li\u003e\n              \n            \u003c/ol\u003e\n            \u003cdiv class=\"card__section card__section--subdued\"\u003e\n              \u003cdiv class=\"row\" style=\"flex-wrap:nowrap;align-items:flex-start\"\u003e\u003cspan class=\"muted\"\u003e\n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/\u003e\u003cpath d=\"M12 11v5.5\"/\u003e\u003cpath d=\"M12 7.5v.01\"/\u003e\u003c/svg\u003e\n\u003c/span\u003e\u003cspan class=\"muted\"\u003eSecurity plugins sometimes block the REST API. If the test fails, allow /wp-json/ for our requests.\u003c/span\u003e\u003c/div\u003e\n            \u003c/div\u003e\n          \u003c/section\u003e\n        \n      \u003c/div\u003e\n\n    \n  \u003c/main\u003e","scripts":[]},"help-faq":{"title":"Help \u0026 support","html":"\u003cmain class=\"page page--narrow\"\u003e\n    \u003cheader class=\"page-header\"\u003e\n      \u003cdiv\u003e\n        \u003ch1 class=\"page-header__title\"\u003eHelp \u0026amp; support\u003c/h1\u003e\n        \u003cp class=\"page-header__sub\"\u003eHow to set up, how to create API keys, and answers to common questions.\u003c/p\u003e\n      \u003c/div\u003e\n      \n        \u003cdiv class=\"page-header__actions\"\u003e\n          \u003ca class=\"btn\" href=\"mailto:support@example.com\" target=\"_top\"\u003e\n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/\u003e\u003cpath d=\"M9.5 9.5a2.5 2.5 0 0 1 4.9.6c0 1.7-2.4 2.2-2.4 3.9\"/\u003e\u003cpath d=\"M12 17v.01\"/\u003e\u003c/svg\u003e\n Contact support\u003c/a\u003e\n        \u003c/div\u003e\n      \n    \u003c/header\u003e\n\n    \n    \u003cnav class=\"tabs tabs--standalone\" aria-label=\"Help sections\"\u003e\n      \n        \u003cbutton class=\"tabs__tab\" type=\"button\" data-navigate=\"/help?tab=install\" \u003eInstallation steps\u003c/button\u003e\n      \n        \u003cbutton class=\"tabs__tab\" type=\"button\" data-navigate=\"/help?tab=keys\" \u003eAPI keys\u003c/button\u003e\n      \n        \u003cbutton class=\"tabs__tab tabs__tab--on\" type=\"button\" data-navigate=\"/help?tab=faq\" aria-current=page\u003eFAQ\u003c/button\u003e\n      \n    \u003c/nav\u003e\n\n    \n\n      \u003csection class=\"card\"\u003e\n        \n        \n          \u003cdetails class=\"faq__item\"\u003e\n            \u003csummary class=\"faq__question\"\u003e\u003cspan\u003eWill the migration change or delete anything in my old store?\u003c/span\u003e\n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"m6 9 6 6 6-6\"/\u003e\u003c/svg\u003e\n\u003c/summary\u003e\n            \u003cp class=\"faq__answer\"\u003eNo. We only ask for read-only keys and only read from your old store. It keeps working exactly as before until you switch your domain to Shopify.\u003c/p\u003e\n          \u003c/details\u003e\n        \n          \u003cdetails class=\"faq__item\"\u003e\n            \u003csummary class=\"faq__question\"\u003e\u003cspan\u003eCan I close the browser while it runs?\u003c/span\u003e\n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"m6 9 6 6 6-6\"/\u003e\u003c/svg\u003e\n\u003c/summary\u003e\n            \u003cp class=\"faq__answer\"\u003eYes. The migration runs on our server in the background. Come back any time to watch the progress — you also get an email when it finishes.\u003c/p\u003e\n          \u003c/details\u003e\n        \n          \u003cdetails class=\"faq__item\"\u003e\n            \u003csummary class=\"faq__question\"\u003e\u003cspan\u003eWhat happens if I run a migration twice?\u003c/span\u003e\n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"m6 9 6 6 6-6\"/\u003e\u003c/svg\u003e\n\u003c/summary\u003e\n            \u003cp class=\"faq__answer\"\u003eNothing is duplicated. We remember every record we moved (old ID → new Shopify ID), so a second run skips what is already in Shopify. “Migrate recent data” uses the same memory to move only new or changed records.\u003c/p\u003e\n          \u003c/details\u003e\n        \n          \u003cdetails class=\"faq__item\"\u003e\n            \u003csummary class=\"faq__question\"\u003e\u003cspan\u003eWhy did some products fail?\u003c/span\u003e\n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"m6 9 6 6 6-6\"/\u003e\u003c/svg\u003e\n\u003c/summary\u003e\n            \u003cp class=\"faq__answer\"\u003eUsually because Shopify has no equivalent: grouped products, more than 3 attributes (Shopify allows 3 options), or an image address that no longer works. The results screen lists every one with the reason; fix them in your old store and press “Retry failed”.\u003c/p\u003e\n          \u003c/details\u003e\n        \n          \u003cdetails class=\"faq__item\"\u003e\n            \u003csummary class=\"faq__question\"\u003e\u003cspan\u003eDo my customers get emails?\u003c/span\u003e\n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"m6 9 6 6 6-6\"/\u003e\u003c/svg\u003e\n\u003c/summary\u003e\n            \u003cp class=\"faq__answer\"\u003eOnly if you choose “Send account invite emails”. Imported orders never email customers unless you untick “Do not email customers about imported orders”.\u003c/p\u003e\n          \u003c/details\u003e\n        \n          \u003cdetails class=\"faq__item\"\u003e\n            \u003csummary class=\"faq__question\"\u003e\u003cspan\u003eWill my Google rankings survive the move?\u003c/span\u003e\n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"m6 9 6 6 6-6\"/\u003e\u003c/svg\u003e\n\u003c/summary\u003e\n            \u003cp class=\"faq__answer\"\u003eTick “301 Redirects” and every old product, category, page and post address is redirected to its new Shopify address, so links and search results keep working.\u003c/p\u003e\n          \u003c/details\u003e\n        \n          \u003cdetails class=\"faq__item\"\u003e\n            \u003csummary class=\"faq__question\"\u003e\u003cspan\u003eWhat do you keep, and for how long?\u003c/span\u003e\n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"m6 9 6 6 6-6\"/\u003e\u003c/svg\u003e\n\u003c/summary\u003e\n            \u003cp class=\"faq__answer\"\u003eYour data passes through our server in encrypted files: customer and order files are deleted after 30 days, everything else after 90. Our database keeps only status, counters and ID pairs — never names, emails or addresses. You can delete a migration\u0026#39;s files immediately from its results screen.\u003c/p\u003e\n          \u003c/details\u003e\n        \n          \u003cdetails class=\"faq__item\"\u003e\n            \u003csummary class=\"faq__question\"\u003e\u003cspan\u003eHow am I billed?\u003c/span\u003e\n\n\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"\u003e\u003cpath d=\"m6 9 6 6 6-6\"/\u003e\u003c/svg\u003e\n\u003c/summary\u003e\n            \u003cp class=\"faq__answer\"\u003eThrough Shopify. A paid plan is a recurring Shopify app charge that you approve in your admin, and it appears on your Shopify invoice. The free demo never counts against your plan.\u003c/p\u003e\n          \u003c/details\u003e\n        \n      \u003c/section\u003e\n\n    \n  \u003c/main\u003e","scripts":[]}};</script>
  <script>
/* app.js — behaviour shared by every screen.
 *
 * Any element with data-post="/url" becomes an action button:
 *
 *   <button data-post="/migrations/12/control"
 *           data-body='{"action":"pause"}'
 *           data-confirm="Pause this migration?\n\nIt stops after the current page."
 *           data-confirm-label="Pause"
 *           data-destructive
 *           data-then="/migrations/12">Pause</button>
 *
 * It asks the question (the admin's own dialog), spins while the request
 * runs, shows the server's error in #page-error (or a toast), and on success
 * goes to data-then -- or to the `url` the server answered with, or reloads.
 */
(function () {
  function pageError(message) {
    var box = document.getElementById("page-error");
    if (!box) return window.appToast(message, true);
    var text = box.querySelector("[data-error-text]") || box;
    text.textContent = message;
    box.hidden = false;
    box.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  function clearError() {
    var box = document.getElementById("page-error");
    if (box) box.hidden = true;
  }

  async function postJson(url, body, busy) {
    var response = await window.appFetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {}),
      busy: busy,
    });
    var data = await response.json().catch(function () { return {}; });
    if (!response.ok || data.ok === false) {
      var error = new Error(data.error || "Something went wrong. Try again.");
      error.data = data;
      throw error;
    }
    return data;
  }

  document.addEventListener("click", async function (event) {
    var button = event.target.closest("[data-post]");
    if (!button || button.disabled) return;
    event.preventDefault();
    clearError();

    var message = button.getAttribute("data-confirm");
    if (message) {
      var yes = await window.appConfirm(message.replace(/\\n/g, "\n"), {
        confirmLabel: button.getAttribute("data-confirm-label") || "Confirm",
        destructive: button.hasAttribute("data-destructive"),
      });
      if (!yes) return;
    }

    try {
      var body = button.getAttribute("data-body");
      var data = await postJson(button.getAttribute("data-post"), body ? JSON.parse(body) : {}, button);
      var toast = button.getAttribute("data-toast");
      if (toast) window.appToast(toast);
      var then = button.getAttribute("data-then") || data.url;
      if (!then) {
        // Back to this screen, minus the old (single-use) session token.
        var here = new URL(window.location.href);
        here.searchParams.delete("id_token");
        then = here.pathname + here.search;
      }
      window.appNavigate(then);
    } catch (error) {
      if (error.data && error.data.upgrade) {
        pageError(error.message + " Open Plans to upgrade.");
      } else {
        pageError(error.message);
      }
    }
  });

  /* Copy-to-clipboard and show/hide for secret fields. */
  document.addEventListener("click", function (event) {
    var toggle = event.target.closest("[data-reveal]");
    if (!toggle) return;
    var input = document.getElementById(toggle.getAttribute("data-reveal"));
    if (!input) return;
    var show = input.type === "password";
    input.type = show ? "text" : "password";
    toggle.textContent = show ? "Hide" : "Show";
  });

  /* Rows that open something: keyboard too, not only the mouse. */
  document.addEventListener("keydown", function (event) {
    if (event.key !== "Enter" && event.key !== " ") return;
    var row = event.target.closest("tr[data-navigate], [role=link][data-navigate]");
    if (!row || event.target !== row) return;
    event.preventDefault();
    window.appNavigate(row.getAttribute("data-navigate"));
  });

  window.appPostJson = postJson;
  window.appPageError = pageError;
  window.appClearError = clearError;
})();

  </script>
  <script>
/* Prototype runtime — stands in for the server so the real screens work in a
 * plain browser: navigation, the wizard, Test connection, live progress,
 * pause / resume / cancel, retry, dialogs and toasts.
 *
 * SCREENS (built by scripts/build-prototype.js) holds every screen's HTML,
 * rendered from the app's own EJS templates with sample data.
 */
(function () {
  var nativeTimeout = window.setTimeout.bind(window);
  var nativeInterval = window.setInterval.bind(window);
  var nativeClearTimeout = window.clearTimeout.bind(window);
  var nativeClearInterval = window.clearInterval.bind(window);
  var view = document.getElementById("view");

  /* ---------------- screen timers ----------------
   * Screen scripts poll with setTimeout/setInterval. Track them so leaving a
   * screen stops its polling, and run them 2.5× faster so the demo feels live. */
  var screenTimers = [];
  window.setTimeout = function (fn, ms) {
    var id = nativeTimeout(fn, Math.round((ms || 0) / 2.5));
    screenTimers.push(["t", id]);
    return id;
  };
  window.setInterval = function (fn, ms) {
    var id = nativeInterval(fn, Math.round((ms || 0) / 2.5));
    screenTimers.push(["i", id]);
    return id;
  };
  function clearScreenTimers() {
    screenTimers.forEach(function (t) { (t[0] === "t" ? nativeClearTimeout : nativeClearInterval)(t[1]); });
    screenTimers = [];
  }

  /* ---------------- simulated migrations ---------------- */
  var FULL = [
    { entity: "collections", label: "Collections", total: 36 },
    { entity: "products", label: "Products", total: 1240, failed: 12, skipped: 2 },
    { entity: "customers", label: "Customers", total: 800 },
    { entity: "orders", label: "Orders", total: 3100 },
    { entity: "redirects", label: "Redirects", total: 1264 },
  ];
  var DEMO = [
    { entity: "collections", label: "Collections", total: 20 },
    { entity: "products", label: "Products", total: 20, failed: 1 },
    { entity: "customers", label: "Customers", total: 20 },
    { entity: "orders", label: "Orders", total: 20 },
    { entity: "redirects", label: "Redirects", total: 20 },
  ];

  var sims = {};
  function startSim(id, steps, seconds, alreadyDone) {
    var total = steps.reduce(function (s, x) { return s + x.total; }, 0);
    sims[id] = { id: id, steps: steps, total: total, rate: total / seconds, done: alreadyDone || 0, status: "running", last: Date.now(), started: Date.now() - (alreadyDone ? 14 * 60000 : 0) };
  }
  // Migration #12 is already running when the prototype opens (as in the PDF).
  startSim(12, FULL, 60, 3904);

  function tick(sim) {
    var now = Date.now();
    if (sim.status === "running") sim.done = Math.min(sim.total, sim.done + ((now - sim.last) / 1000) * sim.rate);
    sim.last = now;
    if (sim.status === "running" && sim.done >= sim.total) sim.status = "completed";
  }

  function simStatus(sim) {
    tick(sim);
    var left = sim.done;
    var open = firstOpen(sim);
    var steps = sim.steps.map(function (s) {
      var processed = Math.max(0, Math.min(s.total, Math.floor(left)));
      left -= s.total;
      var share = s.total ? processed / s.total : 1;
      var failed = Math.round((s.failed || 0) * share);
      var skipped = Math.round((s.skipped || 0) * share);
      var status = processed >= s.total ? "done" : s === open && sim.status !== "queued" ? "running" : "pending";
      var note = null;
      if (status === "running") {
        note = share < 0.15 ? "Reading your old store… " + Math.round(share / 0.15 * s.total) + " read" : share < 0.2 ? "Preparing data…" : s.total >= 250 ? "Shopify is creating these…" : "Creating in Shopify…";
      }
      return { entity: s.entity, label: s.label, status: status, phaseNote: note, total: s.total, processed: processed, succeeded: processed - failed - skipped, failed: failed, skipped: skipped, percent: s.total ? Math.floor(share * 100) : 100 };
    });
    var processed = steps.reduce(function (a, s) { return a + s.processed; }, 0);
    return {
      id: sim.id, status: sim.status, total: sim.total, processed: processed,
      percent: Math.min(100, Math.floor((processed / sim.total) * 100)),
      remainingSeconds: sim.status === "running" && processed > 10 ? Math.round(((sim.total - processed) / sim.rate) * 30) /* shown as real-world minutes */ : null,
      steps: steps, cleanup: sim.cleanup || null,
    };
  }
  function firstOpen(sim) {
    var left = sim.done;
    for (var i = 0; i < sim.steps.length; i += 1) {
      if (left < sim.steps[i].total) return sim.steps[i];
      left -= sim.steps[i].total;
    }
    return null;
  }

  var state = { connected: false, wizardStep: 1 };

  /* ---------------- the fake backend ---------------- */
  function json(body, status) {
    return new Response(JSON.stringify(body), { status: status || 200, headers: { "Content-Type": "application/json" } });
  }
  function wait(ms) { return new Promise(function (r) { nativeTimeout(r, ms); }); }

  window.appFetch = async function (url, init) {
    init = init || {};
    var busy = [].concat(init.busy || []).filter(Boolean);
    busy.forEach(function (b) { b.disabled = true; b.classList.add("is-loading"); });
    try {
      await wait(250);
      var body = {};
      try { body = init.body ? JSON.parse(init.body) : {}; } catch (e) { body = {}; }
      var path = new URL(url, location.origin).pathname;
      var m;

      if (path === "/migrations/new") { state.connected = false; state.wizardStep = 1; return json({ ok: true, url: "/migrations/13?step=1" }); }
      if (path === "/migrations/demo") { startSim(14, DEMO, 14); return json({ ok: true, url: "/migrations/14" }); }
      if (path === "/migrations/13/wizard") { state.wizardStep = Math.max(state.wizardStep, body.step + 1); return json({ ok: true, next: body.step + 1 }); }
      if (path === "/migrations/13/connect") {
        await wait(1400);
        if (!/^https:\/\//.test(body.base_url || "https://")) return json({ ok: false, error: "Your store must use https:// — API keys must never be sent over an unencrypted connection." });
        state.connected = true;
        return json({ ok: true, version: "WooCommerce 9.3", hint: "ck_4f9a…c21e", base_url: body.base_url || "https://myshop.com",
          counts: [["Categories", 36], ["Products", 1240], ["Customers", 800], ["Orders", 3100], ["Coupons", 12], ["Pages", 8], ["Blog posts", 32]].map(function (r) { return { label: r[0], count: r[1] }; }) });
      }
      if (path === "/migrations/13/begin") {
        if (body.type === "demo") { startSim(14, DEMO, 14); return json({ ok: true, url: "/migrations/14" }); }
        startSim(12, FULL, 60); return json({ ok: true, url: "/migrations/12" });
      }
      if (path === "/migrations/13/discard") return json({ ok: true });
      if ((m = path.match(/^\/migrations\/(\d+)\/status$/))) {
        var sim = sims[m[1]];
        return sim ? json(simStatus(sim)) : json({ status: "completed", steps: [] });
      }
      if ((m = path.match(/^\/migrations\/(\d+)\/control$/))) {
        var s = sims[m[1]];
        if (s) { tick(s); s.status = { pause: "paused", resume: "running", cancel: "cancelled" }[body.action]; s.last = Date.now(); }
        return json({ ok: true });
      }
      if ((m = path.match(/^\/migrations\/(\d+)\/retry$/))) {
        startSim(12, [{ entity: "products", label: "Products", total: 12 }], 6);
        return json({ ok: true, url: "/migrations/12" });
      }
      if ((m = path.match(/^\/migrations\/(\d+)\/delta$/))) {
        startSim(12, [{ entity: "products", label: "Products", total: 18 }, { entity: "orders", label: "Orders", total: 64 }], 10);
        return json({ ok: true, url: "/migrations/12" });
      }
      if ((m = path.match(/^\/migrations\/(\d+)\/demo-cleanup$/))) {
        var d = sims[m[1]] || (sims[m[1]] = { steps: [], total: 1, done: 1, status: "completed", last: Date.now(), started: Date.now() });
        d.cleanup = { status: "running" };
        nativeTimeout(function () { d.cleanup = { status: "done", removed: 99, failed: 0 }; }, 3000);
        return json({ ok: true });
      }
      if ((m = path.match(/^\/migrations\/(\d+)\/errors\.csv$/))) {
        return new Response("﻿entity,old_id,name,kind,reason\nproducts,4512,Linen Shirt,failed,Has 4 attributes; Shopify allows 3 options\nproducts,4630,Gift Box,failed,Image URL returned 404\nproducts,4701,Mug Set,failed,Grouped product — Shopify has no equivalent\n", { headers: { "Content-Type": "text/csv" } });
      }
      if (/\/delete-files$|\/disconnect$|^\/setup\/skip$|^\/plans\/select$/.test(path)) return json({ ok: true });
      return json({ error: "Not part of the prototype" }, 404);
    } finally {
      busy.forEach(function (b) { b.disabled = false; b.classList.remove("is-loading"); });
    }
  };

  /* ---------------- dialogs and toasts ---------------- */
  window.appConfirm = function (message, options) {
    options = options || {};
    var parts = String(message).split(/\n{2,}/);
    var title = parts.shift();
    return new Promise(function (resolve) {
      var overlay = document.createElement("div");
      overlay.className = "proto-modal";
      overlay.innerHTML =
        '<div class="proto-modal__card" role="dialog" aria-modal="true">' +
        '<div class="proto-modal__head"></div><div class="proto-modal__body"></div>' +
        '<div class="proto-modal__foot"><button class="btn" data-no>Cancel</button><button class="btn ' + (options.destructive ? "btn--critical" : "btn--primary") + '" data-yes></button></div></div>';
      overlay.querySelector(".proto-modal__head").textContent = title;
      parts.forEach(function (p) { var el = document.createElement("p"); el.textContent = p; overlay.querySelector(".proto-modal__body").appendChild(el); });
      overlay.querySelector("[data-yes]").textContent = options.confirmLabel || "Confirm";
      function done(v) { overlay.remove(); resolve(v); }
      overlay.addEventListener("click", function (e) {
        if (e.target === overlay || e.target.closest("[data-no]")) done(false);
        if (e.target.closest("[data-yes]")) done(true);
      });
      document.addEventListener("keydown", function esc(e) { if (e.key === "Escape") { document.removeEventListener("keydown", esc); done(false); } });
      document.body.appendChild(overlay);
      overlay.querySelector("[data-yes]").focus();
    });
  };

  window.appToast = function (message, isError) {
    var toast = document.createElement("div");
    toast.className = "proto-toast" + (isError ? " proto-toast--error" : "");
    toast.textContent = message;
    document.body.appendChild(toast);
    nativeTimeout(function () { toast.classList.add("proto-toast--out"); }, 2600);
    nativeTimeout(function () { toast.remove(); }, 3000);
  };

  window.appBusy = function () {};

  /* ---------------- the router ---------------- */
  function screenFor(path) {
    var url = new URL(path, location.origin);
    var p = url.pathname;
    var q = url.searchParams;
    var m;
    if (p === "/" || p === "/dashboard") {
      var live = sims[12] && ["running", "paused"].indexOf(sims[12].status) !== -1;
      return live ? "dashboard" : "dashboard-idle";
    }
    if (p === "/setup") return "setup";
    if (p === "/install") return "install";
    if (p === "/migrations") return "list";
    if (p === "/connections") return "connections";
    if (p === "/plans") return "plans";
    if (p === "/help") return "help-" + (["keys", "faq"].indexOf(q.get("tab")) !== -1 ? q.get("tab") : "install");
    if (p === "/migrations/13") {
      var n = Math.min(5, Math.max(1, Number(q.get("step")) || state.wizardStep));
      return n === 2 && !state.connected ? "wizard-2-new" : "wizard-" + n;
    }
    if ((m = p.match(/^\/migrations\/(12|14)$/))) {
      var sim = sims[m[1]];
      if (sim) tick(sim);
      if (!sim || sim.status === "completed") return "results-" + m[1];
      if (sim.status === "cancelled") return "results-12-cancelled";
      return "progress-" + m[1];
    }
    if (p === "/migrations/10") return "results-10";
    if (p === "/migrations/9") return "results-9";
    if (p === "/migrations/8") return "progress-paused";
    if (p.indexOf("/migrations/") === 0) return "results-11";
    return "dashboard";
  }

  var MENU = { dashboard: "/dashboard", setup: "/dashboard", list: "/migrations", wizard: "/migrations", progress: "/migrations", results: "/migrations", connections: "/migrations", plans: "/plans", help: "/help" };

  function show(path, push) {
    clearScreenTimers();
    var key = screenFor(path);
    var screen = window.SCREENS[key];
    view.innerHTML = screen.html;
    document.title = screen.title + " · Store Migration (prototype)";
    // Run the screen's own scripts, as the browser would on a page load.
    screen.scripts.forEach(function (code) {
      var s = document.createElement("script");
      s.textContent = code;
      view.appendChild(s);
    });
    var section = MENU[key.split("-")[0]] || "/dashboard";
    document.querySelectorAll("[data-menu]").forEach(function (a) { a.classList.toggle("is-active", a.getAttribute("data-menu") === section); });
    document.getElementById("proto-current").textContent = key;
    if (push !== false) history.pushState({ path: path }, "", "#" + path);
    window.scrollTo(0, 0);
  }

  window.appNavigate = function (path) { show(path, true); };
  window.addEventListener("popstate", function () { show(location.hash.slice(1) || "/setup", false); });

  // Anything with data-navigate goes there when clicked (shopifyClient.js does this in the app).
  document.addEventListener("click", function (e) {
    var target = e.target.closest("[data-navigate]");
    if (!target || target.disabled || !target.getAttribute("data-navigate")) return;
    e.preventDefault();
    window.appNavigate(target.getAttribute("data-navigate"));
  });

  // The install form would start Shopify OAuth.
  document.addEventListener("submit", function (e) {
    if (!e.target.matches("form[action='/api/auth/install']")) return;
    e.preventDefault();
    window.appToast("Would redirect to Shopify to approve the app");
    nativeTimeout(function () { window.appNavigate("/setup"); }, 900);
  });

  // Links to the real Shopify admin cannot work here.
  document.addEventListener("click", function (e) {
    var a = e.target.closest("a[href^='https://admin.shopify.com'], a[href^='mailto:']");
    if (!a) return;
    e.preventDefault();
    window.appToast(a.href.indexOf("mailto:") === 0 ? "Opens your email app" : "Opens the Shopify admin");
  });

  // The prototype's own menu.
  document.getElementById("proto-toggle").addEventListener("click", function () {
    document.getElementById("proto-menu").toggleAttribute("hidden");
  });
  document.getElementById("proto-menu").addEventListener("click", function (e) {
    var b = e.target.closest("[data-go]");
    if (!b) return;
    if (b.dataset.go === "reset") { location.hash = ""; location.reload(); return; }
    document.getElementById("proto-menu").hidden = true;
    if (b.dataset.state === "connected") state.connected = true;
    if (b.dataset.sim === "full") startSim(12, FULL, 60);
    if (b.dataset.sim === "done") { startSim(12, FULL, 60); sims[12].done = sims[12].total; sims[12].status = "completed"; }
    show(b.dataset.go);
  });

  show(location.hash.slice(1) || "/setup", false);
})();

  </script>
</body>
</html>
